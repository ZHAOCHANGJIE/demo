		var epaperObject = {"curDate":"2026-08-10","paperID":1,"img_small_w":1620,"img_small_h":2389,"imgPrefix":"https://epaper.sgcctop.com/pic/202608/10/","coverPath":"../../../../static/paperRes/945e880f-362e-456c-860b-a6a921708fa7.jpg","bgMusic":"../../../../static/paperRes/ard.mp3","enableBgMusic":false,"enableTurnMusic":true,"bgStyle":"../../../../static/paperRes/56bb722f-7bf8-49a1-9135-be5b1590c2f3.jpg","logoPath":"../../../../static/paperRes/gwb_logo.png","loadingBarColor":"#CC0827","fillWidthBlankPage":false,"folioPageTogether":false,"hasCover":true,"page_1":{"board_id":147830,"board_num":"1","alias":"要闻","img_url":"887005a5-d6bb-450e-ae83-9143af933bb2.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/ef02592b-d542-4202-98b5-885fbff4e8ff.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774016,"yinti":"","title":"全国用电负荷入夏以来四创新高","subtitle":"电网企业压紧压实保供责任，确保迎峰度夏平稳有序","yinwen":"","author":"记者金雨双","content":"<p>    本报讯  从国家能源局获悉，8月7日，全国用电负荷入夏以来第四次创历史新高，达到15.57亿千瓦，较上一次创新高数值上涨约480万千瓦。7月29日以来，全国用电负荷持续高位运行，日最大负荷（除周末假期外）均超过去年极值15.08亿千瓦，尖峰负荷呈现明显“平台化”特征。<\/p><p>    入夏以来，华北、东北、华东等6个区域电网21次创历史新高，北京、辽宁、江苏、江西、四川、甘肃等25个省（自治区、直辖市）用电负荷累计78次创新高。面对持续攀升的用电负荷，国家电网压紧压实保供责任，确保迎峰度夏平稳有序。<\/p><p>    8月3日至4日，国家电网公司经营区华北、华东、东北3个区域电网，河北南网、天津、山东、安徽、辽宁5个省级电网负荷创新高。公司坚决扛牢电力保供首要责任，全网“一盘棋”统筹部署、周密组织，优化电网运行方式，加强源网荷储协同，深挖跨区跨省通道潜力，积极应对高温大负荷考验。<\/p><p>    8月7日，北京电网最大用电负荷首次突破3000万千瓦，连续3天刷新历史纪录。国网北京市电力公司全面加强电网运行监控，动态调整电网运行方式，落实设备巡检、客户服务、应急力量和物资装备优化部署等措施。来自黑龙江的风电和青海的光伏发电“携手”进京，输送绿电达到4700万千瓦时，支撑北京电力保供。同日13时22分，江西电网调度口径最高用电负荷达到3909万千瓦，较去年度夏峰值高出91万千瓦。国网江西省电力有限公司多措并举，全力保障江西电网运行安全稳定。<\/p><p>    跨省跨区电力输送支撑高负荷地区可靠用电。今年迎峰度夏期间，全国跨省跨区输送电力已突破2.78亿千瓦，相当于12座三峡水电站同时发电。<\/p><p>    经济向好驱动用电负荷快速增长。今年上半年，全社会用电量累计达5.1万亿千瓦时，同比增长5.3%，其中第二产业中的高技术及装备制造业用电量增速达9.8%，第三产业中的充换电服务业、互联网数据服务业用电量增速分别达到56.9%、44.0%。这些数据直观反映出我国产业转型升级步伐加快、新动能不断成长壮大，经济发展向新、向绿、向优的态势持续凸显。<\/p>","Transfer":"","coord":"0.480000,15.050000,23.640000,15.050000,23.640000,57.580000,0.480000,57.580000"},{"contentid":774017,"yinti":"","title":"锚定2030，新型电力系统建设全面提速","subtitle":"","yinwen":"","author":"本报记者 王颂","content":"<p>    8月3日，国家发展改革委、国家能源局发布《新型电力系统建设“十五五”规划》（以下简称《规划》），明确未来五年我国电力发展的总体思路，提出到2030年初步建成新型电力系统的战略目标，部署电力行业发展的主要目标、重大工程、重点任务。<\/p><p>    电网连接电力生产和消费，是新型电力系统的核心环节，是支撑能源强国目标落地的关键载体。《规划》坚持目标导向，围绕电力供应、电网发展、用电协同等方面作出部署，把战略目标分解为阶段性务实任务，既明确了新型电网发展的实施路径，更推动新型电力系统建设全面提速、整体提质、系统增效。<\/p><p>    电力供应<\/p><p>    非化石能源发电量占比达到50%，绿色低碳的电力供给格局基本形成<\/p><p>    《规划》提出，到2030年，绿色低碳的电力供给格局基本形成，非化石能源发电量占比达到50%。这意味着，非化石能源特别是风光等新能源，不只是电力系统的增量，更将逐步成为发电结构中的主力。<\/p><p>    “十四五”时期，风电和光伏发电量占比由2020年的9.7%升至2025年的约22%；在风电和光伏的基础上，计入水电和核电的非化石能源发电量占比口径从34%增至42%，距离2030年目标还有8个百分点。<\/p><p>    中国电力企业联合会党委书记、常务副理事长杨昆表示，我国已基本形成煤、气、核和可再生能源多元发展的清洁电力供应体系。“十五五”时期，非化石能源发电装机的主体地位将进一步巩固，电力在终端用能格局中的主体地位进一步强化，为经济社会发展和绿色低碳转型提供有力支撑。<\/p><p>    如何实现非化石能源发电量占比达到50%的目标？《规划》提出系统解决新能源消纳的新举措，明确新能源分类开发布局和利用率分档控制的新要求。<\/p><p>    华北电力大学新能源电力系统全国重点实验室副主任齐波接受记者采访时表示，分档控制的核心在于坚持实事求是。各省资源禀赋、网架结构、调节能力等存在客观差异，发展目标应因地制宜、分类设定。同时应明确，新能源利用率需保持在合理区间，立足系统安全边界统筹优化消纳水平，不能“先上车后补票”。新能源项目要和电网送出工程、储能项目、调节电源同步规划、同步建设。<\/p><p>    新能源大规模开发，对网架结构、电网消纳、跨区输送均提出更高要求。此前，国家电网有限公司发布服务新能源高质量发展十项举措，从规划、网架、消纳等多个维度支撑新能源“发得出、用得上”，更好服务“沙戈荒”新能源基地、水风光基地、海上风电和分布式新能源开发利用，进一步提升新能源消纳调控水平，全力以赴、多措并举做好保量稳率工作。<\/p><p>    由于风电、光伏发电存在波动性和间歇性等特点，电力系统需要具备更强的调节能力，以确保系统稳定。《规划》提出，强化抽水蓄能电站调节作用、加快新型储能电站规模化建设、积极发展车网融合互动等举措。<\/p><p>    在调节能力建设方面，仅抽水蓄能这一项，“十五五”时期，国家电网规划新开工建设抽水蓄能装机容量超3000万千瓦。到2030年，国家电网在运在建抽水蓄能装机容量将超过1.2亿千瓦，可提供1.5亿千瓦以上的电力调节能力，比“十四五”末提升70%以上。<\/p><p>    除了非化石能源发电量占比达到50%，《规划》还提出，非化石电源电力支撑水平达到40%左右。<\/p><p>    50%和40%分别对应的是“全年总账”和“尖峰时刻的硬实力”。在新能源大规模发展的背景下，电力系统既统筹核算全年装机总量、发电电量，也保障负荷高峰、新能源出力偏弱时段的可靠容量支撑能力，确保非化石能源发得出、顶得上。<\/p><p>    电网发展<\/p><p>    西电东送规模超过4.2亿千瓦，配电网承载分布式新能源能力9亿千瓦，着力构建主配微协同的新型电网<\/p><p>    电网等重大基础设施是经济社会运行的底座。随着新能源快速发展、新质生产力加速培育、电力新业态蓬勃发展，电网由传统输配电功能加速向多元综合能源枢纽平台转型。<\/p><p>    《规划》在电网发展方面提出许多具体指标：西电东送规模超过4.2亿千瓦，实现28亿千瓦以上新能源高水平消纳，支撑9亿千瓦分布式新能源接入及安全稳定运行，建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络……<\/p><p>    实现这些目标，电网面临新形势新要求。《规划》提出，着力构建主配微协同的新型电网。2025年年底出台的《关于促进电网高质量发展的指导意见》也提出，到2030年，主干电网和配电网为重要基础、智能微电网为有益补充的新型电网平台初步建成。<\/p><p>    中电联规划发展部主任张琳认为，作为新型能源基础设施的重要组成、新型能源体系和新型电力系统构建的关键环节，新型电网建设对于保障能源安全、促进绿色发展具有重要意义。<\/p><p>    为了更好适应新型电力系统和新型能源体系建设要求，新型电网建设的发力点在哪？国网经济技术研究院有限公司主网规划中心主任王智冬介绍，主干电网应着力推动电力流向布局优化，加强区域间电网互联互济水平，持续优化完善区域主网架结构；配电网建设应科学规划发展规模和空间布局，加强配电网安全基础和韧性能力，提高新型用能主体接入保障能力；微电网建设着力点在于因地制宜推动微电网发展，强化技术攻关，完善标准体系，优化相关体制机制，促进与虚拟电厂、综合能源服务、乡村全面振兴等融合发展，拓展应用场景。<\/p><p>    从主网到配电网再到微电网，新型电网建设加快推进。主网层面，“十五五”时期，公司特高压在建总体规模超过“十三五”与“十四五”规模总和，电网建设进入全面提速、跨越升级的新阶段。配电网层面，公司规划新建改造110千伏及以下线路长度较“十四五”增长40%左右，城市、农村、边远地区配电网“毛细血管”将进一步补强。微电网层面，公司积极探索末端保供型、离网型模式，建设一批县域有源配电网、村镇级微电网示范工程，提高偏远地区和电网末端供电可靠水平。<\/p><p>    “十五五”时期，我国电力需求仍将保持刚性增长，年均新增用电量预计达到6000亿千瓦时，相当于每年新增一个中等经济体量国家的用电水平，确保电力安全供应面临新挑战。<\/p><p>    记者注意到，在《规划》提出的16项主要指标中，15项为预期性指标，唯一的约束性指标是全国电力供应充裕度，由2025年的小于1.1提高到2030年的大于1.1，意味着系统总的供电能力要比最大用电负荷多出10%以上的余量。这也释放出明确信号：安全是底线。<\/p><p>    电网安全与公共安全具有强关联性、穿透性。电力保供是公司的首要责任。“十五五”时期，公司提出统筹考虑碳达峰总体目标、承接煤炭和石油达峰的用能转移、经济社会发展的用电需求刚性增长，科学研判需求总量和电力流向，科学谋划电网发展规划，加快推进电网安全体系和能力现代化，确保大电网安全，保障电力供应，满足经济社会发展和人民美好生活用电需要。<\/p><p>    用电协同<\/p><p>    电能占终端能源消费比重达到35%，促进用电侧协同发展<\/p><p>    激发用电侧协同互动能力，大力促进虚拟电厂发展，倡导全社会节约用电，持续提升绿电应用和电气化水平……围绕“促进用电侧协同发展”，《规划》明确了一系列重点任务，并提出具体目标：到2030年电能占终端能源消费比重达35%。<\/p><p>    “35%的驱动力主要来自人工智能、大数据中心等产业带动的电力需求增长以及工业领域、交通领域、建筑领域电气化水平的提升。”清华四川能源互联网研究院数字化电力规划设计研究所副所长王基认为，未来，电网不仅是输送电能的基础设施，更是连接新能源、电力市场和终端用户的能源配置平台。<\/p><p>    以算力为例，中电联发布数据显示，预计“十五五”时期，全国算力用电量年均新增1000亿千瓦时以上，到2030年预计达8000亿千瓦时，占全社会用电量6%左右。<\/p><p>    面对算力产业发展带来的用电需求增长，公司超前研判算力用电增长趋势，强化算力基础设施与电源、电网协同规划，提高电力供给能力，满足算力中心高比例绿电利用需求，同时加强算力中心并网管理和技术服务，保障电网安全稳定运行。<\/p><p>    《规划》还提出一系列促进电力与相关领域协同融合发展的举措，比如“促进电热、电氢等协同联动”“推动电力与交通融合发展”等，体现出新型电力系统与现代化产业体系之间的相互促进作用。<\/p><p>    紧扣融合发展，电网在用能侧大有可为。公司发挥自身优势和特点，深入推动工业、建筑、交通、农业等领域电能替代，提升消费侧电气化水平，拓展能效公共服务，为重点企业提供用能监测服务，增强新能源汽车充电服务保障能力，引导全社会节约用能、高效用能、绿色用能。<\/p><p>    在提升终端电气化水平的基础上，《规划》提出引导扩大绿电消费。如今，绿电消费已加速向交通、建筑、居民生活等多场景延伸。工业园区、外向型企业对绿电绿证的需求持续释放；居民在供暖、交通等环节多用绿电，让生活更低碳；东西部推进产业梯度转移与新能源电量消纳协同对接，使得绿电就地消纳。<\/p><p>    扩大绿电应用，离不开市场机制的不断完善。今年上半年，国家电网经营区省间绿电交易电量达641亿千瓦时，同比增长23%。北京电力交易中心绿证交易平台累计交易绿证7411万个，同比增长15%。电力市场化交易在能源绿色转型中扮演的角色越来越重要。<\/p><p>    “十五五”时期是夯实基础、全面发力的关键时期，也是如期实现碳达峰目标、加快建设能源强国的关键时期。随着《规划》明确的各项任务稳步推进、落地落实，到2030年，初步建成的新型电力系统将为国家能源安全、中国式现代化建设提供更坚实有力的支撑。<\/p>","Transfer":"","coord":"26.540000,15.160000,100.030000,15.160000,100.030000,42.970000,26.540000,42.970000"},{"contentid":774018,"yinti":"","title":"公司系统树立和践行正确政绩观学习教育工作专班第三次推进会召开","subtitle":"","yinwen":"","author":"郭萱","content":"<p>    本报讯 8月6日，国家电网公司系统树立和践行正确政绩观学习教育工作专班第三次推进会召开。公司党组副书记邵国勇出席会议并讲话。<\/p><p>    邵国勇强调，要抓好学习贯彻习近平党建思想这一重要政治任务，系统把握习近平党建思想中关于树立和践行正确政绩观的论述和要求，将其转化为推进学习教育的具体举措；把习近平党建思想作为学习研讨的重要内容，组织党员、干部读原著学原文悟原理，深刻领会习近平党建思想的重大意义、精髓要义和实践要求。要确保整改整治取得实效，严格工作标准，紧盯突出问题，加强销号管理。要扎扎实实立好制度规矩，加强制度评估结果应用，持续抓好建章立制，强化制度刚性执行。要认真组织开展评估总结，实事求是抓好评估工作，全面客观总结做法成效。<\/p><p>    会上，公司党组学习教育工作专班各工作组、3家基层单位分别汇报学习教育工作。<\/p>","Transfer":"","coord":"27.340000,46.350000,72.530000,46.350000,72.530000,57.690000,27.340000,57.690000"},{"contentid":774019,"yinti":"","title":"英大传媒联合南网传媒、国能传媒启动纪念红军长征胜利九十周年采访活动","subtitle":"","yinwen":"","author":"记者马佳","content":"<p>    本报讯  今年是红军长征胜利90周年。为传承红色基因、弘扬长征精神，8月7日，由英大传媒投资集团有限公司、南方电网数字传媒科技有限公司、国家能源集团传媒中心有限公司联合开展的“弘扬伟大长征精神 走好新时代长征路”纪念红军长征胜利90周年大型主题采访活动在中央红军长征集结出发地江西于都启动。<\/p><p>    采访团将分三路出发，穿越十余个省份，循着当年红军长征的足迹开展采访。采访团将深入历史现场和工程一线，通过全媒体视角，以笔触和镜头，宣传长征精神的时代回响，展现新时代高质量发展的崭新面貌，充分展现在能源电力的支撑助力下，山河变迁、时代革新、老区振兴的丰硕成果，推动长征精神薪火相传。<\/p><p>    本次采访将围绕四个主题展开：聚焦历史节点，讲好红色故事，展示长征精神的丰富内涵和重大历史与现实意义；聚焦民生发展，讲好富民故事，展现能源电力央企服务民生发展的实际行动；聚焦乡村振兴，讲好电力故事，挖掘能源电力企业服务革命老区产业发展、文旅融合的举措；聚焦绿色发展，讲好转型故事，深入报道能源电力企业服务能源强国建设的生动实践。<\/p><p>    据了解，这次活动由中国行业报协会指导，将围绕长征主题开展全链条、跨领域联合采访。采访团成员表示，将聚力同行，用脚力丈量红色热土，用眼力挖掘一线故事，用脑力洞察思想深度，用笔力书写行业担当，全力打造主题宣传成果，用心宣传能源电力行业赓续长征精神、赋能高质量发展的时代答卷。<\/p><p>    启动仪式安排了集体学习，中共于都县委党校副校长李金生作了《长征是检验政绩观的伟大远征》专题授课。随后，与会人员前往中央红军长征出发纪念馆学习。据了解，本次活动深度融合党建引领与青年人才培育，英大传媒“书香先锋”青马小组成员参加启动活动。<\/p>","Transfer":"","coord":"76.230000,54.630000,99.390000,54.630000,99.390000,86.370000,76.230000,86.370000"},{"contentid":774020,"yinti":"","title":"台风“白海豚”登陆 全力以赴抢修保供电","subtitle":"","yinwen":"","author":"朱斐白 林丽平 周瑾","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    本报讯 据中央气象台消息，今年第13号台风“白海豚”（强台风级）的中心于8月9日17时30分在浙江玉环坎门沿海登陆，登陆时中心附近最大风力14级（42米/秒）。<\/p><p>    国网浙江省电力有限公司启动Ⅰ级防台风应急响应，以最高标准、最严要求、最实举措，全力以赴应对台风“白海豚”。该公司强化重要通道运维保障，依托智能管控系统对特高压变电站设备运行状态实施全天候实时监测；根据台风路径变化动态调整受台风影响区域电网运行方式；强化跨区域协同，提前调派骨干力量驰援温州、台州等受台风影响重点区域。目前，该公司密切关注气象条件变化，科学有序组织抢修力量出动，严格落实“风停、水退、人进、电通”原则，以最快速度抢修复电。<\/p><p>    国网福建省电力有限公司全面落实各项防范措施，通过闽电气象平台实时监测台风路径、风速、雨情等信息；加强电网设备特巡特护，检查防汛重点变电站、低洼易涝配电站房；综合应用智能巡检、无人机技术排查可能受影响的变电站、输电线路，加固568基杆塔拉线；集结抢修队伍385支共6597人，备好发电车、发电机、龙吸水、排水方舱等应急装备7426件。<\/p><p>    国网江苏省电力有限公司依托江苏电网防灾减灾中心的电力气象微应用，加强天气预测和预警，协同各单位梳理电网风险清单，动态评估输变配电设备安全风险；围绕重点区域开展电网设备防汛防台风拉网式排查；提前对接重要客户开展特巡，完善应急处置预案、做好设备运维保障。<\/p>","Transfer":"","coord":"71.400000,87.350000,71.400000,60.200000,1.610000,60.200000,1.610000,98.690000,71.400000,98.690000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/23a6d1ec-8193-42d7-8ebc-5e8869cd3229.jpg.1","text":"    图① 8月9日上午，浙江玉环市供电公司楚门供电所员工在台风登陆前紧急更换因大风发生故障的芦浦镇尖山村03号公共变压器。陈维益  摄"},{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/5f600f06-efca-4c09-b438-e3ffe576d2eb.jpg.1","text":"    图② 8月9日，上海浦东供电公司员工抢修10千伏秋祥线受损杆上变压器。    陈昊  摄"},{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/044e5f07-765a-4c05-bfbf-fe33abafffac.jpg.1","text":"    图③ 8月9日，江苏太仓市供电公司员工巡检排灌闸，重点检查水泵、配电柜等设施。黄天荣  摄"}]}]},"page_2":{"board_id":147831,"board_num":"2","alias":"要闻","img_url":"90580960-cde4-4878-b477-62074e068670.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/d86ba706-3332-48bf-b6c7-db55ca7483d3.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774021,"yinti":"","title":"“电力工程号B星”实现数据分钟级回传","subtitle":"","yinwen":"国网工研院研发便携式卫星地面接收站，并验证电力卫星同轨即拍即传能力","author":"张思航 王可","content":"<p>    本报讯 8月1日，国网电力工程研究院有限公司电力卫星资源应用中心项目组在四川雅安完成便携式卫星地面接收站与电网雷达遥感科研卫星“电力工程号B星”的星地数据传输链路实地测试，首次成功验证电力卫星同轨即拍即传能力，将卫星数据从拍摄到回传的时延压缩至分钟级，标志着电力卫星数据获取链路技术取得关键性突破。<\/p><p>    传统固定卫星地面接收站受站址条件限制，在卫星完成对地观测后，需在轨等待过境窗口期，方可接收卫星数据，从卫星拍摄到数据落地通常需要两小时以上。在山火、洪涝等突发灾害场景下，这一时延难以满足快速研判的需求，影响电网灾害应急响应效率。针对这一技术难题，国网工研院研发了便携式卫星地面接收站，并开展测试验证。<\/p><p>    7月31日18时，国网工研院卫星中心基于气象预测，研判出四川阿坝、攀西地区电网工程施工点位未来24小时内将出现暴雨天气，存在洪涝及地质灾害风险，于是提前向“电力工程号B星”上传应急拍摄指令。8月1日15时13分，国网工研院卫星中心联合国网四川省电力公司调度“电力工程号B星”，对这些施工点位开展应急拍摄。卫星成像后，迅速通过部署于雅安的便携式卫星地面接收站完成同轨数据回传，30分钟内完成L2级卫星数据产品的自动化生产。经卫星遥感影像分析，该区域未见洪涝地质灾害隐患，施工点位安全可控。相较传统固定卫星地面接收站接收模式，便携式卫星地面接收站的数据获取时延平均缩短约两小时，显著提升了西南山区电网灾害应急响应的数据时效性。<\/p><p>    便携式卫星地面接收站不受固定站址限制，可灵活部署在应急一线，配合电力卫星同轨即拍即传技术，大幅缩短电力卫星数据从“天上”到“手上”的时间差，解决了复杂地形条件下电力卫星数据回传时效性不佳的难题。<\/p><p>    “电力工程号B星”于3月16日成功发射并进入预定轨道。卫星搭载国网工研院牵头研制的电力专用雷达载荷，采用X波段合成孔径雷达，最高空间分辨率0.5米，重访周期3至4天，可穿透云雾实现全天候对地观测。“电力工程号B星”与已在轨运行的“电力工程号A星”光学卫星、“电力红外卫星A星”共同组网，构成“光学辨形、红外识热、雷达穿云”的电网卫星协同感知体系，实现对电网环境、设备状态和典型灾害风险隐患的多维度、全天候、精细化智能感知。<\/p><p>    下一步，国网工研院卫星中心将持续推进多星数据回传链路验证与技术迭代，完善星地一体化遥感监测体系，为电网灾害应急感知与快速响应提供更加高效的数据保障。<\/p>","Transfer":"","coord":"0.410000,6.180000,65.240000,6.180000,65.240000,26.260000,0.410000,26.260000"},{"contentid":774022,"yinti":"","title":"宁夏上半年外送电量创新高","subtitle":"外送范围增至22个省份","yinwen":"","author":"卢薇 张吉生","content":"<p>    本报讯 近日从国网宁夏电力有限公司获悉，上半年宁夏电网累计外送电量499.96亿千瓦时，创历史新高；新能源发电装机占比已突破65%，统调新能源发电量占比达37.99%，外送电量中新能源电量占比攀升至32%。<\/p><p>    如今，宁夏已建成银东、灵绍、中衡3条超高压、特高压直流外送通道，外送总容量2000万千瓦。自2010年以来，宁夏累计外送电量已达9383.11亿千瓦时。上半年，国网宁夏电力完成“十五五”电网规划编制，推动第4条直流外送通道“宁电入皖”及750千伏立体双环网相关工程纳入国家相关规划，750千伏南湾输变电工程等6项工程获得核准。<\/p><p>    上半年，宁夏绿电首次直送广东，并开启“宁电入闽”新通道，中长期外送范围由原先的19个省份增加至22个省份。5月，宁夏新能源中长期外送计划电量23亿千瓦时，占中长期外送总计划电量的32%，单月新能源中长期外送电量占比创新高。国网宁夏电力争取中长期外送增量，与华东、华中、华北、西北、西南、东北区域的25个省份沟通，锁定青海、陕西、上海、北京等增送方向，协商达成后续月份增送规模可达10亿千瓦时。<\/p><p>    在省间现货市场方面，国网宁夏电力专题分析省间现货报价及成交特点，指导新能源企业参与省间现货交易，上半年组织调度短期送出电量48.1亿千瓦时，其中新能源电量达30.8亿千瓦时。<\/p>","Transfer":"","coord":"70.630000,6.180000,99.420000,6.180000,99.420000,25.420000,70.630000,25.420000"},{"contentid":774023,"yinti":"","title":"国网河南电力强化外包队伍管理","subtitle":"开展“人人过关”考核，提升现场安全水平","yinwen":"","author":"霍鑫 欧阳运广","content":"<p>    本报讯 “登杆作业过程中不能失去安全防护措施，高空作业时要有后备防护措施……”8月3日上午，在河南省新野县10千伏沙赵线王堰北台区改造施工现场，外包队伍工作负责人吕配涛向新野县供电公司安全督查人员黄成鑫复述当天作业安全风险点，并周密做好开工前的各项准备。当天，各项作业按既定计划安全有序完成。这是国网河南省电力公司创新开展外包队伍人员“人人过关”考核的典型场景。<\/p><p>    外包领域是安全管理工作的重点。2025年以来，国网河南省电力公司坚持“严入、强训、必考”原则，开展外包队伍人员“人人过关”考核，严把作业现场准入关，着力提升现场安全管理水平。<\/p><p>    “人人过关”考核即在实施作业现场全员准入理论考试基础上，增加实操考核和面试考问环节。在实操考核中，国网河南电力结合常见及重点现场作业风险点，科学设置不同风险场景。被考核人员逐一在场景中进行实际操作、检验安全技能，再通过安全规章制度等方面的当面考问，方可“过关”。<\/p><p>    截至8月初，国网河南电力利用“人人过关”考核，累计考核外包人员12万人次，淘汰不合格外包人员6000余人，有效防止不合格外包人员进入现场作业，为保障作业现场长周期安全打下坚实基础。<\/p><p>    该公司还创新实施外包队伍和自有作业班组一体化管理，统筹提升外包队伍安全管理质效。<\/p>","Transfer":"","coord":"70.630000,28.090000,99.420000,28.090000,99.420000,47.610000,70.630000,47.610000"},{"contentid":774024,"yinti":"","title":"带电消除导线断股缺陷","subtitle":"","yinwen":"","author":"程超  摄","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    8月5日，湖北送变电工程有限公司带电作业班员工带电消除500千伏木孝Ⅱ线导线断股缺陷。作业人员借助“小飞人”电动升降装置快速到达作业点位，并利用重载无人机开展吊装。<\/p>","Transfer":"","coord":"0.620000,28.790000,65.240000,28.790000,65.240000,52.530000,0.620000,52.530000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/23aa1aad-6872-4295-99fd-6d377fd50188.jpg.1","text":""}]},{"contentid":774025,"yinti":"","title":"协调各类调节资源顶峰出力","subtitle":"","yinwen":"国网吉林电力","author":"张继权  宋俣昕","content":"<p>    本报讯 近期，吉林省出现持续高温天气，全省用电负荷不断攀升。8月5日11时22分，吉林电网最大负荷达1529.8万千瓦，今年入夏以来第三次创新高。<\/p><p>    “极热无风”天气下，电力负荷持续增长。面对输电断面重载等多重考验，国网吉林省电力有限公司深化政企协同、网厂协同，多措并举确保电力可靠供应。该公司密切跟踪天气变化，精准预测负荷和新能源出力，滚动校核电力供需平衡，积极向政府主管部门汇报电力供需形势，争取购电政策支持。<\/p><p>    国网吉林电力强化机组非计划停运、出力受阻风险防控及电煤保障管理，提前安排煤电机组应检必检，推进新建等容量替代机组调试投运，优化储能装置和光热电站调用，保障各类调节资源顶峰出力；充分发挥省间互济优势，利用跨区错峰效应和通道剩余能力开展跨区中长期购电，7月通过省间现货和区内互济市场最大购入电力260万千瓦，有效保障尖峰时段电力供应。此外，该公司还进一步加强电网运行管控，优化电网运行方式，严控输电断面潮流和负荷中心电压，实时监测重载设备、电源送出线路，滚动修订事故应急预案，确保大负荷期间电网平稳运行。<\/p><p>    当前已进入迎峰度夏关键期，国网吉林电力持续关注天气变化及负荷增长情况，全力应对高温大负荷考验。<\/p>","Transfer":"","coord":"70.630000,53.510000,99.420000,53.510000,99.420000,74.300000,70.630000,74.300000"},{"contentid":774026,"yinti":"","title":"四川500千伏绵州变电站主变压器扩建工程投运","subtitle":"","yinwen":"国网四川电力","author":"王康力 王志奇","content":"<p>    本报讯 8月7日，位于四川省绵阳市涪城区的500千伏绵州变电站主变压器扩建工程投运。绵州变电站成为绵阳容量最大的500千伏变电站，绵阳电网最大顶峰供电能力提升至520万千瓦，为迎战新一轮用电高峰提供支撑。<\/p><p>    绵州变电站于2021年投运，是绵阳四座500千伏变电站之一。近年来，随着绵阳经济快速发展、产业项目持续落地，绵阳南部区域用电负荷持续高位增长，绵州变电站扩容升级迫在眉睫。绵州变电站主变压器扩建工程新增100万千伏安主变压器及全套配套附属设施，变电站总容量由200万千伏安增至300万千伏安，可满足新增负荷需求，大幅提升了区域电网承载力与供电可靠性。<\/p><p>    该工程面临任务重、多作业面交叉施工等挑战。国网四川超高压公司与绵阳供电公司严格落实安全风险分级管控与全员到岗到位监督机制，针对施工各环节量身定制专项安全管控措施，并依托远程智能监控平台赋能现场安全管理，全面夯实安全根基；坚持定期组织施工质量专项培训与作业风险前置审查，严格执行多级验收机制，科学统筹施工资源、优化工序，多专业协调联动，高效破解施工难题，将高标准、严要求贯穿工程建设全过程。<\/p><p>    今年，绵阳电网按期建成9项强网工程和27项配网补强项目，加大设备特巡及隐患排查力度，全力保障电网安全稳定运行。<\/p>","Transfer":"","coord":"70.630000,77.250000,99.420000,77.250000,99.420000,99.580000,70.630000,99.580000"},{"contentid":774027,"yinti":"","title":"超特高压无人机验电接地技术行业标准发布","subtitle":"由中国电科院牵头，甘肃兰州供电公司主要参与编写","yinwen":"","author":"史双绚 胡锦军","content":"<p>    本报讯 8月4日，从甘肃兰州供电公司获悉，由中国电力科学研究院牵头、兰州供电公司主要参与编写的电力行业标准DL/T 3017.2—2026《架空电力线路无人机辅助检修技术导则第2部分：验电及挂拆接地线》已正式由国家能源局发布。该公司自主研发的“欧姆双翼式无人机接触式验电器及接地装置”核心技术被纳入该标准。<\/p><p>    当天，在兰州330千伏能化送出输电线路施工现场，作业人员站在地面远程操控搭载验电器的无人机升空。无人机悬停于导线上方，将验电器落在导线上，声光装置实时反馈带电状态。验电完成后，无人机携带接地线，依次挂接至杆塔端及导线端。拆除作业时，无人机利用解锁挂钩将接地线夹依次拆除。全过程仅需一名操作手。<\/p><p>    “过去干这活，人站在几十米高的铁塔上，手握着绝缘杆，特别累不说，还得时刻提防脚下踩空、感应电上身。”现场工作负责人刘力说，“现在人站在地面上，操控无人机干，矮点的塔3到4分钟，高点的塔5到6分钟就能做完。”<\/p><p>    2023年年初，兰州供电公司成立“创客联盟”研发团队，在国内首次提出无人机直接接触导线进行验电及挂拆接地线的技术路线，建立了“理论研究—电场仿真—样机迭代—现场验证—优化改良”全闭环研发体系。团队先后攻克了强电磁环境下的信号干扰、不同截面导线的可靠适配、大风天气装置防脱落、整体结构轻量化等核心技术难题。研发人员反复开展数十次模拟试验验证，经过四代产品迭代，历时两年多成功研制出“欧姆双翼式无人机接触式验电器及接地装置”，为该标准的制定打下基础。<\/p>","Transfer":"","coord":"0.620000,55.060000,65.240000,55.060000,65.240000,67.130000,0.620000,67.130000"},{"contentid":774028,"yinti":"","title":"锚定2030，新型电力系统建设全面提速","subtitle":"","yinwen":"","author":"本报记者 王颂","content":"<p>    8月3日，国家发展改革委、国家能源局发布《新型电力系统建设“十五五”规划》（以下简称《规划》），明确未来五年我国电力发展的总体思路，提出到2030年初步建成新型电力系统的战略目标，部署电力行业发展的主要目标、重大工程、重点任务。<\/p><p>    电网连接电力生产和消费，是新型电力系统的核心环节，是支撑能源强国目标落地的关键载体。《规划》坚持目标导向，围绕电力供应、电网发展、用电协同等方面作出部署，把战略目标分解为阶段性务实任务，既明确了新型电网发展的实施路径，更推动新型电力系统建设全面提速、整体提质、系统增效。<\/p><p>    电力供应<\/p><p>    非化石能源发电量占比达到50%，绿色低碳的电力供给格局基本形成<\/p><p>    《规划》提出，到2030年，绿色低碳的电力供给格局基本形成，非化石能源发电量占比达到50%。这意味着，非化石能源特别是风光等新能源，不只是电力系统的增量，更将逐步成为发电结构中的主力。<\/p><p>    “十四五”时期，风电和光伏发电量占比由2020年的9.7%升至2025年的约22%；在风电和光伏的基础上，计入水电和核电的非化石能源发电量占比口径从34%增至42%，距离2030年目标还有8个百分点。<\/p><p>    中国电力企业联合会党委书记、常务副理事长杨昆表示，我国已基本形成煤、气、核和可再生能源多元发展的清洁电力供应体系。“十五五”时期，非化石能源发电装机的主体地位将进一步巩固，电力在终端用能格局中的主体地位进一步强化，为经济社会发展和绿色低碳转型提供有力支撑。<\/p><p>    如何实现非化石能源发电量占比达到50%的目标？《规划》提出系统解决新能源消纳的新举措，明确新能源分类开发布局和利用率分档控制的新要求。<\/p><p>    华北电力大学新能源电力系统全国重点实验室副主任齐波接受记者采访时表示，分档控制的核心在于坚持实事求是。各省资源禀赋、网架结构、调节能力等存在客观差异，发展目标应因地制宜、分类设定。同时应明确，新能源利用率需保持在合理区间，立足系统安全边界统筹优化消纳水平，不能“先上车后补票”。新能源项目要和电网送出工程、储能项目、调节电源同步规划、同步建设。<\/p><p>    新能源大规模开发，对网架结构、电网消纳、跨区输送均提出更高要求。此前，国家电网有限公司发布服务新能源高质量发展十项举措，从规划、网架、消纳等多个维度支撑新能源“发得出、用得上”，更好服务“沙戈荒”新能源基地、水风光基地、海上风电和分布式新能源开发利用，进一步提升新能源消纳调控水平，全力以赴、多措并举做好保量稳率工作。<\/p><p>    由于风电、光伏发电存在波动性和间歇性等特点，电力系统需要具备更强的调节能力，以确保系统稳定。《规划》提出，强化抽水蓄能电站调节作用、加快新型储能电站规模化建设、积极发展车网融合互动等举措。<\/p><p>    在调节能力建设方面，仅抽水蓄能这一项，“十五五”时期，国家电网规划新开工建设抽水蓄能装机容量超3000万千瓦。到2030年，国家电网在运在建抽水蓄能装机容量将超过1.2亿千瓦，可提供1.5亿千瓦以上的电力调节能力，比“十四五”末提升70%以上。<\/p><p>    除了非化石能源发电量占比达到50%，《规划》还提出，非化石电源电力支撑水平达到40%左右。<\/p><p>    50%和40%分别对应的是“全年总账”和“尖峰时刻的硬实力”。在新能源大规模发展的背景下，电力系统既统筹核算全年装机总量、发电电量，也保障负荷高峰、新能源出力偏弱时段的可靠容量支撑能力，确保非化石能源发得出、顶得上。<\/p><p>    电网发展<\/p><p>    西电东送规模超过4.2亿千瓦，配电网承载分布式新能源能力9亿千瓦，着力构建主配微协同的新型电网<\/p><p>    电网等重大基础设施是经济社会运行的底座。随着新能源快速发展、新质生产力加速培育、电力新业态蓬勃发展，电网由传统输配电功能加速向多元综合能源枢纽平台转型。<\/p><p>    《规划》在电网发展方面提出许多具体指标：西电东送规模超过4.2亿千瓦，实现28亿千瓦以上新能源高水平消纳，支撑9亿千瓦分布式新能源接入及安全稳定运行，建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络……<\/p><p>    实现这些目标，电网面临新形势新要求。《规划》提出，着力构建主配微协同的新型电网。2025年年底出台的《关于促进电网高质量发展的指导意见》也提出，到2030年，主干电网和配电网为重要基础、智能微电网为有益补充的新型电网平台初步建成。<\/p><p>    中电联规划发展部主任张琳认为，作为新型能源基础设施的重要组成、新型能源体系和新型电力系统构建的关键环节，新型电网建设对于保障能源安全、促进绿色发展具有重要意义。<\/p><p>    为了更好适应新型电力系统和新型能源体系建设要求，新型电网建设的发力点在哪？国网经济技术研究院有限公司主网规划中心主任王智冬介绍，主干电网应着力推动电力流向布局优化，加强区域间电网互联互济水平，持续优化完善区域主网架结构；配电网建设应科学规划发展规模和空间布局，加强配电网安全基础和韧性能力，提高新型用能主体接入保障能力；微电网建设着力点在于因地制宜推动微电网发展，强化技术攻关，完善标准体系，优化相关体制机制，促进与虚拟电厂、综合能源服务、乡村全面振兴等融合发展，拓展应用场景。<\/p><p>    从主网到配电网再到微电网，新型电网建设加快推进。主网层面，“十五五”时期，公司特高压在建总体规模超过“十三五”与“十四五”规模总和，电网建设进入全面提速、跨越升级的新阶段。配电网层面，公司规划新建改造110千伏及以下线路长度较“十四五”增长40%左右，城市、农村、边远地区配电网“毛细血管”将进一步补强。微电网层面，公司积极探索末端保供型、离网型模式，建设一批县域有源配电网、村镇级微电网示范工程，提高偏远地区和电网末端供电可靠水平。<\/p><p>    “十五五”时期，我国电力需求仍将保持刚性增长，年均新增用电量预计达到6000亿千瓦时，相当于每年新增一个中等经济体量国家的用电水平，确保电力安全供应面临新挑战。<\/p><p>    记者注意到，在《规划》提出的16项主要指标中，15项为预期性指标，唯一的约束性指标是全国电力供应充裕度，由2025年的小于1.1提高到2030年的大于1.1，意味着系统总的供电能力要比最大用电负荷多出10%以上的余量。这也释放出明确信号：安全是底线。<\/p><p>    电网安全与公共安全具有强关联性、穿透性。电力保供是公司的首要责任。“十五五”时期，公司提出统筹考虑碳达峰总体目标、承接煤炭和石油达峰的用能转移、经济社会发展的用电需求刚性增长，科学研判需求总量和电力流向，科学谋划电网发展规划，加快推进电网安全体系和能力现代化，确保大电网安全，保障电力供应，满足经济社会发展和人民美好生活用电需要。<\/p><p>    用电协同<\/p><p>    电能占终端能源消费比重达到35%，促进用电侧协同发展<\/p><p>    激发用电侧协同互动能力，大力促进虚拟电厂发展，倡导全社会节约用电，持续提升绿电应用和电气化水平……围绕“促进用电侧协同发展”，《规划》明确了一系列重点任务，并提出具体目标：到2030年电能占终端能源消费比重达35%。<\/p><p>    “35%的驱动力主要来自人工智能、大数据中心等产业带动的电力需求增长以及工业领域、交通领域、建筑领域电气化水平的提升。”清华四川能源互联网研究院数字化电力规划设计研究所副所长王基认为，未来，电网不仅是输送电能的基础设施，更是连接新能源、电力市场和终端用户的能源配置平台。<\/p><p>    以算力为例，中电联发布数据显示，预计“十五五”时期，全国算力用电量年均新增1000亿千瓦时以上，到2030年预计达8000亿千瓦时，占全社会用电量6%左右。<\/p><p>    面对算力产业发展带来的用电需求增长，公司超前研判算力用电增长趋势，强化算力基础设施与电源、电网协同规划，提高电力供给能力，满足算力中心高比例绿电利用需求，同时加强算力中心并网管理和技术服务，保障电网安全稳定运行。<\/p><p>    《规划》还提出一系列促进电力与相关领域协同融合发展的举措，比如“促进电热、电氢等协同联动”“推动电力与交通融合发展”等，体现出新型电力系统与现代化产业体系之间的相互促进作用。<\/p><p>    紧扣融合发展，电网在用能侧大有可为。公司发挥自身优势和特点，深入推动工业、建筑、交通、农业等领域电能替代，提升消费侧电气化水平，拓展能效公共服务，为重点企业提供用能监测服务，增强新能源汽车充电服务保障能力，引导全社会节约用能、高效用能、绿色用能。<\/p><p>    在提升终端电气化水平的基础上，《规划》提出引导扩大绿电消费。如今，绿电消费已加速向交通、建筑、居民生活等多场景延伸。工业园区、外向型企业对绿电绿证的需求持续释放；居民在供暖、交通等环节多用绿电，让生活更低碳；东西部推进产业梯度转移与新能源电量消纳协同对接，使得绿电就地消纳。<\/p><p>    扩大绿电应用，离不开市场机制的不断完善。今年上半年，国家电网经营区省间绿电交易电量达641亿千瓦时，同比增长23%。北京电力交易中心绿证交易平台累计交易绿证7411万个，同比增长15%。电力市场化交易在能源绿色转型中扮演的角色越来越重要。<\/p><p>    “十五五”时期是夯实基础、全面发力的关键时期，也是如期实现碳达峰目标、加快建设能源强国的关键时期。随着《规划》明确的各项任务稳步推进、落地落实，到2030年，初步建成的新型电力系统将为国家能源安全、中国式现代化建设提供更坚实有力的支撑。<\/p>","Transfer":"","coord":"0.620000,69.660000,65.240000,69.660000,65.240000,99.580000,0.620000,99.580000"}]},"page_3":{"board_id":147832,"board_num":"3","alias":"综合","img_url":"de54cd20-39d0-47b5-a76e-2c976fe07ce7.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/b05c2a7a-6e69-49eb-b0b8-0c2973a34398.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774029,"yinti":"","title":"  ","subtitle":"","yinwen":"","author":"","content":"<p>    编者按  年初以来，国家电网有限公司加速推进营销数智技术应用，多个典型场景推广应用、攻坚取得新突破。本版今日起推出营销人工智能应用系列报道，展示公司营销领域一批人工智能落地应用创新案例。<\/p>","Transfer":"","coord":"8.290000,6.180000,59.440000,6.180000,59.440000,7.870000,8.290000,7.870000"},{"contentid":774030,"yinti":"","title":"“超级大脑”创新营销现场作业模式","subtitle":"——营销人工智能应用系列报道①","yinwen":"国网山东电力","author":"段德咏 张治林","content":"<p>    <\/p><p>    7月15日，山东省济南市历下区恒隆广场出现计量装置异常故障。接到报修后，济南供电公司历下供电中心员工侯振第一时间赶到现场。恒隆广场是济南核心商圈的重要商业综合体，也是济南供电公司重点保障的电力客户。<\/p><p>    与以往不同的是，侯振这次现场作业时带上了一套“随身专家”——由智能背夹和人工智能（AI）眼镜组成的营销计量专家系统。赶到现场后，他通过AI眼镜的语音交互功能与营销计量专家系统实时对话，完成安全措施布置、许可开工等作业前准备。<\/p><p>    营销计量专家系统通过AI眼镜自动识别故障现场三相智能电能表设备信息，实时调取能源互联网营销服务系统等业务系统中存储的设备型号、额定参数、历史运维台账等数据，并通过多模态大模型智能研判，精准检测出客户用电设备B相电压异常，并给出“检查接线端子”的处置建议。<\/p><p>    在营销计量专家系统指导下，侯振很快找到了故障根源并完成缺陷消除，全程用时不到20分钟，与传统作业相比，作业时长大幅压缩。故障处置完毕后，恒隆广场物业对接人刘经理说：“商场入驻店铺多，客流量大，本来还担心故障检查维修会用很长时间，没想到这么快就把问题解决了！”<\/p><p>    “以往处置复杂计量故障，依赖员工的经验判断，遇到疑难问题有时无从下手。现在有了营销计量专家系统，就好像一位智能专家在身边全程指导，我们现场作业时心里也更踏实了。”侯振说。<\/p><p>    营销计量专业部门的一项重要任务就是确保客户的用电数据精准计量、用电信息高效传输，确保电能表、采集装置和互感器等设备安全稳定运行。目前营销现场作业存在点多面广、场景复杂、安全隐患隐蔽性强、疑难故障处置难度大等问题。国家电网有限公司创新开发了营销计量专家系统，有效解决营销计量专业现场复杂故障处置、前后端协同、作业安全风险管控等方面的痛点。今年7月，该系统开始在国网山东电力等单位试点应用。<\/p><p>    营销计量专家系统采用“云-边-端”三级协同架构。云侧部署在营销现场作业平台内部，其核心组件包括专家系统服务、推理模型管理、模型训练、计量知识库等，汇聚了整个国家电网公司系统计量运维规程、故障处置案例、标准化作业规范等海量资源。它是整个系统的“超级大脑”，负责给现场作业人员提供远程支持。<\/p><p>    现场作业人员携带的智能背夹属于边缘层，负责完成现场数据快速解析、本地智能推理，保障作业响应零延迟。<\/p><p>    AI眼镜为交互终端，负责语音、图像、视频等信息的采集及实时交互。它将现场“看到”的情况“告诉”云端的“超级大脑”，并将“超级大脑”反馈的信息传达给现场作业人员，且佩戴方便，解放了作业人员的双手。<\/p><p>    7月17～20日，在2026世界人工智能大会上，国家电网公司多项人工智能创新成果亮相。营销计量专家系统是国家电网展厅互动区的参展项目之一，相关与会嘉宾在现场观摩后对该系统给予了高度评价。<\/p><p>    济南供电公司计量中心采集抄表班副班长王石川作为参展现场讲解人员，向参观者介绍、演示了系统的“问专家、识万物、辨风险、查隐患、随身教”五大基本功能。这些AI功能，王石川已经体验过很多次了。在他看来，营销计量专家系统是全天候“虚拟安全员”，可实时感知现场作业环境、人员操作行为。如果识别到作业人员操作存在安全隐患，系统会自动预警提醒。它又是“随身专家”，遇到复杂疑难问题，现场作业人员可以随时语音提问，系统智能调取典型案例与专业规程，为现场作业人员提供“全域查询、答疑解惑、综合会诊、伴随指引、作业评估”等服务，切实提升了作业人员的单兵作战能力。现场作业完成后，系统作业评估模块会自动生成一份详细的成绩单，从效率高低、操作是否规范、质量好不好等多个角度打分，并指出哪里可以改进。<\/p><p>    营销计量专家系统不仅可以用于计量装置采集异常运维，还可以应用在电能计量装置的新装、更换与拆除作业，计量装置的新装检验、周期检验、故障检验等，以及计量箱、电能表、互感器、采集终端等设备的巡查与缺陷整改。<\/p><p>    自试点应用营销计量专家系统以来，济南供电公司相关班组改变了传统人工核查、经验判断的作业模式，大幅精简作业流程、缩短单次作业时长，有效提升现场作业的质效。同时，该成果实现了国家电网公司系统专家经验、典型故障案例、标准化作业流程的共享，有助于一线员工快速提升业务能力，真正实现“人人有专家赋能、次次有标准可循”。<\/p>","Transfer":"","coord":"26.300000,9.130000,41.430000,9.130000,41.430000,10.530000,26.300000,10.530000,26.300000,9.130000,33.760000,31.180000,67.110000,31.180000,67.110000,19.800000,67.110000,11.800000,0.410000,11.800000,0.410000,19.800000,0.410000,53.370000,33.760000,53.370000,33.760000,31.180000"},{"contentid":774031,"yinti":"","title":"“三零”服务接入容量标准提升至200千瓦","subtitle":"","yinwen":"湖北鄂州供电公司落实低压民营经济客户办电新举措","author":"苏小云 吴慧","content":"<p>    本报讯 7月30日，湖北省鄂州市五星商贸有限责任公司负责人邵乐通过“网上国网”APP提交200千伏安用电新装申请，鄂州供电公司当日完成现场勘查并制订专属接电方案。这笔业务是湖北省试点将低压民营经济客户“三零”服务接入容量标准提升至200千瓦后首单民营企业办电业务。<\/p><p>    五星商贸主营金属材料、建筑装饰材料销售，因新店筹备需新增200千瓦低压用电容量。如按原有160千瓦接入上限政策，超出部分对应的变压器采购、管线敷设等外线配套工程费用须企业自行承担。<\/p><p>    7月29日起，国网湖北省电力有限公司在武汉、鄂州、咸宁三地试点将低压民营经济客户“三零”服务接入容量上限从160千瓦提高至200千瓦。该企业符合新政要求，外线铺设、配电设备及施工建设费用全部由供电企业承担，企业无须投入配套资金，全程线上办理，实现“零上门、零审批、零投资”，直接节省电力建设成本超10万元。“不用承担一分配套成本，全程线上申报不用跑一次营业厅，新政策实实在在为我们民营企业减负了。”邵乐说。<\/p><p>    本次服务升级在拓展接入范围的同时还全面压缩了办电流程时长。目前，鄂州地区低压无外线工程办电全程不超过5个工作日，涉及外线施工项目不超过15个工作日。年初以来，鄂州供电公司持续深化“三零”服务，已累计为中小微企业节约办电成本超1000万元，同时依托政企信息共享机制，常态化推行“水电气讯”联办、“不动产+供电”联合过户等一站式服务，大幅压减客户办电时长。<\/p>","Transfer":"","coord":"72.490000,6.180000,99.420000,6.180000,99.420000,28.930000,72.490000,28.930000"},{"contentid":774032,"yinti":"","title":"甘肃金昌供电公司升级配电自动化系统功能","subtitle":"提升配网数据感知能力和图形展示精准性","yinwen":"","author":"杨吉英  魏佩","content":"<p>    本报讯  8月3日，甘肃金昌供电公司完成配电自动化系统内的配电网单线图可视化生成、遥测数据状态估计等功能升级，提升配网数据感知能力和图形展示精准性，推动配网运维从人工粗放管控向数智管控转型。<\/p><p>    升级前，金昌配网智能化基础较为薄弱，馈线自动化、智能终端设备覆盖率偏低，部分负荷数据无法实时监测，形成运维监控盲区；配电自动化系统自动生成的配电单线图线路交错、布局杂乱，图纸与现场适配度不高，影响日常调度及故障处置效率。此外，智能终端离线、数据异常易引发线路越级跳闸，以往依靠人工排查研判，易出现疏漏。<\/p><p>    金昌供电公司升级遥测数据状态估计功能，依托分段、分支智能开关的实测遥测数据，精准推算老旧无采集功能开关的实时负荷，消除老旧设备监测盲区，实现全网所有开关负荷在线监测。<\/p><p>    升级后的配电网单线图可视化生成功能，可对全部馈线自动化、智能终端设备运行状态24小时在线感知、异常预警，并自动识别离线及数据异常终端，一键批量导出问题清单，形成智能开关缺陷台账，帮助运维人员推进离线及异常终端治理。此外，该功能还可自动规整线路排布，区分主干与分支线路，理顺交错线条，同步联动电网网架动态更新，确保图实相符，清晰展示全网实测及估算负荷数据，为线路运维、故障处置、应急保供电提供精准数据支撑。<\/p>","Transfer":"","coord":"72.490000,31.460000,99.420000,31.460000,99.420000,52.530000,72.490000,52.530000"},{"contentid":774033,"yinti":"","title":"“随身专家” 让现场作业更从容","subtitle":"","yinwen":"","author":"本报记者 倪旻","content":"<p>    当一线员工依托由智能背夹和人工智能（AI）眼镜组成的营销计量专家系统开展现场作业，过去依靠经验判断的作业模式正在发生改变。这套营销计量专家系统整合了海量专业知识、故障案例，成为一线员工的“随身专家”，为基层现场作业注入数智力量，也为传统行业数字化转型提供了生动样本。<\/p><p>    搭载AI技术的设备走出实验室，成为扎根一线的实用工具。电力营销现场作业点多面广，故障场景复杂多变，疑难问题处置高度依赖作业人员经验。济南恒隆广场计量装置故障处置中，作业人员佩戴AI眼镜，依托营销计量专家系统，快速完成设备识别、数据调取、故障研判，不到20分钟便消除设备缺陷，作业效率显著提升。<\/p><p>    营销计量专家系统不只是提升作业效率的利器，还能助力一线人员业务能力快速提升。该系统把分散在各地的典型案例、专家经验、作业规程汇聚共享，实现“人人有专家赋能、次次有标准可循”。即便面对复杂工况，一线人员也能获得实时指导，降低作业门槛，补齐能力短板，提升单兵作战能力。<\/p><p>    营销计量专家系统为AI赋能一线作业提供了参考经验。创新不仅要在技术层面不断突破，更要瞄准现实痛点，把先进技术转化为看得见的效能。以数字技术改造传统生产方式、提升生产效率、创新作业模式，让一线人员干活更从容、处置更精准。<\/p>","Transfer":"","coord":"34.590000,35.110000,67.110000,35.110000,67.110000,53.510000,34.590000,53.510000"},{"contentid":774034,"yinti":"","title":"冷库电缆故障 紧急抢修复电","subtitle":"","yinwen":"","author":"李毅 董少波","content":"<p>    8月5日13时许，河北省行唐县玉亭乡屹嗒头村鹤麟农业科技有限公司的冷库出现用电故障，企业没有专业电工，负责人王老门打电话向行唐县供电公司上方供电所台区经理孙昌战求助。<\/p><p>    鹤麟农业公司的冷库存储香菇20余吨，长时间断电会导致香菇变质，需要尽快恢复供电。接到求助电话后，孙昌战立即和同事赵换朝携带抢修工具赶到现场。<\/p><p>    孙昌战打开企业电表箱，先用万用表测量电能表进线端和出线端的电压，电压数值显示均正常。接着，赵换朝打开冷库配电箱，发现空气开关已经跳闸，重合不成功，初步判定故障出在通往冷库的电缆线路或冷库内部线路上。<\/p><p>    孙昌战和赵换朝拿出电缆故障测试仪，沿着通往冷库的电缆一段一段排查。检查到冷库南墙这段电缆线路时，电缆故障测试仪显示电压异常，他们看到一处电缆绝缘层破损，内部线芯烧焦，还散发着刺鼻的焦煳味。“应该是最近几天下了暴雨，雨水渗入导致电缆受潮短路。”孙昌战向王老门说明情况。<\/p><p>    故障电缆属于客户资产，考虑到冷库不能长时间断电，孙昌战立即向上方供电所汇报现场情况，申请提供延伸服务，主动帮客户处置故障。获得准许后，赵换朝迅速返回供电所准备修复电缆所需的材料和工具，孙昌战在现场设置围栏、警示牌，做好安全防护。<\/p><p>    14时20分，赵换朝赶回现场，抢修工作开始。孙昌战拿出剥线钳把电缆的绝缘层剥离，清除短路导线烧焦的外皮。赵换朝拿出绝缘胶带，把三相导线和电缆外层缠上绝缘胶布，同时做了防水处理。<\/p><p>    14时49分，电缆修复完毕，孙昌战拿出绝缘电阻表，对电缆进行绝缘检测，确定电缆绝缘合格。他合上空气开关，冷库的制冷设备重新运转起来。<\/p>","Transfer":"","coord":"72.490000,57.580000,99.420000,57.580000,99.420000,83.430000,72.490000,83.430000"},{"contentid":774035,"yinti":"","title":"国网陕西电力一成果获评智能体创新实践标杆案例","subtitle":"","yinwen":"","author":"魏刚 杨家伟","content":"<p>    本报讯 近日，由国网陕西省电力有限公司联合中国电信陕西分公司共同开展的“基于多智能体协同的施工方案生成与审核关键技术研究与应用”项目入选中国信息通信研究院《2026智能经济新形态：智能体创新实践汇编》，获评智能体创新实践标杆案例。该项目聚焦电力工程建设数字化转型关键需求，攻克了电力图纸智能识别、大模型防幻觉等技术难题，创新采用“多智能体协同+大小模型联动”技术架构，全面实现输电线路施工方案编制、审核全流程自动化、智能化。应用该项目成果，单份专项施工方案编制周期由过去的15天压缩至5分钟，大幅提升方案编制效率，为能源基建领域数字化、智能化转型提供可复制、可推广的实践样板。国网陕西电力持续深耕智能体技术迭代，拓展特高压工程全施工工序应用场景，不断推动数智技术赋能能源基建。<\/p>","Transfer":"","coord":"0.620000,88.480000,32.520000,88.480000,32.520000,99.580000,0.620000,99.580000"},{"contentid":774036,"yinti":"","title":"辽宁朝阳供电公司开展高温特巡保电专项行动","subtitle":"","yinwen":"","author":"陈阳","content":"<p>    本报讯 连日来，辽宁朝阳地区持续高温。8月1日，朝阳供电公司组织人员对220千伏慕北线、燕海线等重载线路开展高温保供电特巡，防范高温下易发的主网设备故障异常，确保电网安全稳定运行。朝阳供电公司采用“一线一案”“一站一案”精细化运维模式，结合无人机巡检、智能监控系统等技术手段，构建“人工+科技”立体防护网，对重要输电线路、重要枢纽变电站加密特巡特护频次，完善风险防范措施和应急处置方案。入伏以来，朝阳供电公司累计排查500千伏线路13条共668.6千米、220千伏线路26条共586.31千米、66千伏线路42条共322.12千米，累计特巡220千伏变电站22座、66千伏变电站105座，发现并及时处置主变压器油温高、箱柜通风不良等问题25处，确保设备可靠运行。<\/p>","Transfer":"","coord":"35.210000,88.620000,66.070000,88.620000,66.070000,99.720000,35.210000,99.720000"},{"contentid":774037,"yinti":"","title":"黑龙江伊春供电公司保障文旅产业可靠用电","subtitle":"","yinwen":"","author":"程钰龙","content":"<p>    本报讯 近日，黑龙江省伊春市迎来暑期旅游客流高峰，景区、住宿、餐饮等用电需求持续攀升。针对全市16个重点景区保电任务重、点位分散的特点，伊春供电公司组建20支文旅服务队，定期开展安全用电巡检，并在12家国家4A级以上旅游景区安排专人24小时应急值守。针对旺季民宿办电、用电需求激增的情况，该公司推行“上门问诊、全程代办、随叫随到”服务模式，开通办电绿色通道，为55家民宿提供“三零”服务，办电时长压缩40%以上。伊春供电公司还设立10个电力便民服务驿站，依托数字化平台实时监测重点景区线路，上门为景区提供用电服务。近日，文化和旅游部正式印发《旅游强国建设“十五五”规划》，伊春市被列入重点旅游城市。伊春供电公司将持续提升供电服务品质，全力保障文旅产业可靠用电。<\/p>","Transfer":"","coord":"68.770000,88.620000,99.210000,88.620000,99.210000,99.720000,68.770000,99.720000"},{"contentid":774038,"yinti":"","title":"架设线路","subtitle":"","yinwen":"","author":"孙政  摄","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p><\/p>","Transfer":"","coord":"2.900000,56.040000,64.620000,56.040000,64.620000,79.920000,2.900000,79.920000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/9e941462-b903-4612-84d2-7be00fb8cf38.jpg.1","text":"    8月4日，安徽郎溪县供电公司施工人员在郎溪县经济开发区内架设110千伏云台变电站10千伏配套送出工程线路。该工程建成投运后，将有力提升区域电网供电能力。"}]}]},"page_4":{"board_id":147833,"board_num":"4","alias":"综合","img_url":"af96c10b-063b-40fb-a46d-0bad0b1ee245.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/7e2e98a6-82e2-48f8-afc3-27283640145c.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774039,"yinti":"","title":"河北邯郸供电公司多举措优化技术监督体系","subtitle":"“独立监督+数字赋能”，技术监督质效双提升","yinwen":"","author":"齐晓峰 李钊","content":"<p>    本报讯 近日，河北邯郸供电公司依托优化后的技术监督体系完成了220千伏临漳南输变电工程等31项电网工程的技术监督工作。年初以来，邯郸供电公司通过优化组织架构、整合检测资源、加强数字化技术应用等手段，持续强化技术监督全链条管理。<\/p><p>    针对职责分工不够合理、专业检测力量薄弱等问题，邯郸供电公司抽调发展、建设、设备等技术专家，成立技术监督中心，下设检测评价班，明确岗位职责；建立双重监督机制，安排专业部门依据年度计划组织项目单位落实技术标准，技术监督中心同步指派检测评价班开展独立监督，并将检查结果纳入项目单位季度考核。1～7月，技术监督中心技术人员累计发现各类问题447项，准确率同比提升33个百分点，问题闭环整改率保持100%。<\/p><p>    为进一步提升过程监管效能，邯郸供电公司依托“i国网”APP搭建移动监督平台，内嵌电气、土建等10类专业技术标准，并借助人工智能识别等技术校验阶段评审报告、监造监理日志等工程资料，辅助专业人员查找问题。针对技术监督同类多发问题、苗头性问题，该公司专业人员发出告警单，对问题整改超期单位发出督办单，限期完成治理。1～7月，技术监督问题整改平均用时同比减少30%。<\/p><p>    邯郸供电公司还建立了技术监督检测基地，设立材料、油气等5个市级实验室和3个县级检测分部，并按需配置气相色谱仪、局部放电检测装置等107套核心装备，为检测人员提供实操实训平台；与河北电力科学研究院开展技术培训、专业取证、检测授权等方面合作，协同攻关设备状态智能预警、多源异构数据诊断等技术难题。1～7月，邯郸供电公司技术监督检测基地15人通过相关资质认证，检测授权资格项目提升至12项。<\/p>","Transfer":"","coord":"69.800000,6.180000,99.420000,6.180000,99.420000,29.920000,69.800000,29.920000"},{"contentid":774040,"yinti":"","title":"改革破题添活力 创新驱动促发展","subtitle":"","yinwen":"浙江华电研究院","author":"邵敏敏 李志伟","content":"<p>    近日，由浙江华电器材检测研究院有限公司参编的《多旋翼无人机氢动力电池应用框架》国际标准在2026世界无人机大会上亮相。该标准是全球首个氢能源无人机框架标准，围绕氢能电池动力系统、安全措施、运行管理等维度构建起全要素规范指引。标准编制过程中，该院牵头负责氢动力无人机测试与应用板块，依托在电力装备检测、氢能安全验证等领域的技术优势，深度参与了标准条款研讨、技术验证、指标梳理等关键工作。<\/p><p>    近年来，浙江华电研究院立足新型电力系统建设，坚持以改革破局、以创新开路，在科研平台搭建、核心技术攻关、低碳服务拓展等方面取得突破性成果。<\/p><p>    深化机制改革 激发内生动力<\/p><p>    改革之初，浙江华电研究院从治理源头入手，配强董事会，梳理各治理主体权责清单，构建“多单一表”权责体系，并在决策清单中专门增补科研投入、项目立项等内容，从制度上确立科技创新的战略先导地位。<\/p><p>    “过去大事小事都上党委会，党委既管方向又管执行，现在有了‘多单一表’，权责更清晰了。党委会前置把关，董事会对重大经营事项进行最终审议和决策，效率进一步提高。”浙江华电研究院综合部主任陈烨说。<\/p><p>    治理架构理顺之后，市场化用人及激励机制改革随即跟进。在过去的考核分配方式和行政化用人模式下，科研人员需要完成一定的事务性工作，难以全心专注攻关。<\/p><p>    浙江华电研究院大刀阔斧打破平均主义，建立差异化绩效考核与薪酬分配机制，根据考核结果进一步拉开收入差距，通过实施科技成果积分制、设立重大创新贡献“金牛奖”、实行项目收益分红等一系列举措，累计激励百余人次。以价值贡献为核心的分配体系让科研人员的收入与产出直接挂钩，推动“要我干”变为“我要干”。同时，该院设置了专职型创新工作室和兼职型检测研究员岗位，将日常检测生产与科研创新分割开来，让科研人员有更多时间和精力潜心钻研。<\/p><p>    改革举措落地见效，企业发展活力不断释放。2025年，浙江华电研究院营业收入和利润总额较实施“科改行动”前的2021年分别增长52.93%、90.19%，获评国家专精特新“小巨人”企业、浙江省服务业领军企业等。<\/p><p>    聚焦科技创新 锻造核心能力<\/p><p>    机制优化为创新松绑，但要培育出有竞争力的技术能力，还须在科研组织方式和技术攻关路径上作出系统性调整。浙江华电研究院组建以院士为核心的浙江省重点院士工作站，推行以市场应用为导向的集成产品开发体系，建立揭榜挂帅、基层群创等12项机制，形成“专家领航、青年攻坚、应用为先、制度保障”的协同科研模式。<\/p><p>    2月，浙江华电研究院完成浙江省首次500千伏输电线路耐张线夹分体式无人机X射线带电检测，实现超高压线路“不停电、无接触、高精度”检测。此次检测所用的设备正是该院省重点院士工作站推动高端装备国产替代的最新成果。目前，该工作站正加速推进X射线成像设备全国产化替代，研制多分裂导线检测机器人，探索“无人机+机器人”协同作业在不同工况下的适用路径。<\/p><p>    有了科研机制支撑，如何将有限资源精准投入关键技术领域？浙江华电研究院围绕检测服务搭建起以专业大类为界、产品种类为核、通用专业为链的网格化技术管理体系，将分散的技术能力拧成一股绳。如今，材料器件、配电设备、新能源3个专业研究所和76个细分技术实验室协同运转，获得中国计量认证、中国合格评定国家认可委员会资质认定的参数达5326项，技术能力向专精特新迈进。<\/p><p>    今年年初，浙江省经济和信息化厅公布2025年度浙江省重点企业研究院认定名单，浙江华电研究院建设的“浙江省新型电力系统数智检测技术重点企业研究院”入选，被纳入省级科技创新平台“白名单”管理。该院聚焦电网故障主动防御、新能源并网安全等7个技术方向展开攻关。<\/p><p>    依托平台牵引和创新机制，浙江华电研究院创新产出能力持续提升，近3年累计建成国家级平台1个、省部级平台9个，相关成果获得科技奖励24项、国家发明专利授权109项。<\/p><p>    延伸检测边界 拓宽发展路径<\/p><p>    检测机构的价值不仅是出具一份报告，也要走向市场寻找更大的价值空间。传统来样检测的业务模式不仅收益上限较低，也难以深度融入产业链。2022年以来，浙江华电研究院持续提升技术能力，从检测服务商向技术服务商加速转型。<\/p><p>    沿着这一思路，浙江华电研究院在传统检测业务的基础上，逐步拓展数据分析、技术咨询等综合服务，打造“检测+量化评估”增值模式。今年3月，该院在220千伏泽国变电站完成了老旧混凝土构支架全维度耐久性检测评估，系统评估构件剩余服役寿命，并制订差异化处置方案，避免了“一刀切”式更换或过度维修。随着服务链条拉长，该院价值创造能力显著增强，2025年通过这一模式实现的营收较2022年增长136.55%。<\/p><p>    紧跟低碳发展大势，浙江华电研究院在绿色服务领域培育出新的增长点。2月，该院获批中国合格评定国家认可委员会温室气体审定与核查机构认可资质，正式进入国际互认的温室气体核查专业领域，并于5月承担2026年浙江省碳交易纳入企业温室气体排放报告核查项目。该院还联合浙江省天目山实验室等机构组建低空飞行器、电力机器人测评实验室，为新兴产业发展提供技术支撑。“检测+新兴产业”类业务从2022年起步，2025年的营收占比已达到14.16%。<\/p><p>    基于此，浙江华电研究院进一步深耕产业生态，布局“检测+未来产业生态”。5月，该院申报的能源电力安全应急与防护装备中试平台入选工业和信息化部重点培育名单，构建起覆盖“概念验证—中试熟化—产业落地”的全流程服务体系，为上下游企业提供测试认证、成果转化、产品开发等多元服务。随着具身智能机器人实验室、输电线路真型试验基地相继建成，该院业务正逐步从配套检测向技术配套服务升级。<\/p>","Transfer":"","coord":"0.410000,6.320000,63.790000,6.320000,63.790000,48.600000,0.410000,48.600000"},{"contentid":774041,"yinti":"","title":"重庆电力物资公司创新供应商资质核验模式","subtitle":"为电网物资精准采购筑牢数据基础","yinwen":"","author":"陈威浩","content":"<p>    本报讯 近日，重庆电力物资公司完成2026年度10千伏金具、在线监测系统、变电站巡检机器人等重点品类的供应商资质能力文件核实工作，精准摸排属地供应链产能情况，从源头筑牢电网物资采购质量防线。<\/p><p>    本次资质核实工作任务量重、覆盖面广。重庆电力物资公司调派89名专业核查专家，全方位、精细化核验578家供应商的资质合规性、技术研发实力、历史履约实绩等，全面排查供应链资质风险隐患，掌握各类电力物资供应商整体供货能力，为精准采购、优质选材筑牢数据基础。<\/p><p>    为实现资质核实与招标采购的无缝衔接、高效联动，重庆电力物资公司修订完善资质核实工作管理规范，优化标准化核验信息模板，细化试验报告核心字段审核标准，统一全品类核查判定口径，进一步提升招标采购环节资质甄别效率与精准度。截至目前，该公司累计督促333家供应商对照全新标准更新完善资质信息。<\/p><p>    针对本次核实工作品类繁杂、技术壁垒高等特点，重庆电力物资公司创新提质核查模式，邀请重庆电力科学研究院资深技术专家全程驻场督导，破解产品试验判定、项目业绩认定、技术参数核验等方面的难点问题；执行专家交叉复核机制，逐项逐条复审核验企业生产产能、核心准入资质、关键技术指标等硬性条件，规避单人核查偏差，确保核实结果客观、严谨，为后续招标采购工作提供支撑。<\/p><p>    重庆电力物资公司有序推进渝、滇两地属地供应商现场核查工作，持续优化线上文件核验、线下实地抽查的一体化核验体系，健全物资供应商优胜劣汰的良性竞争机制，打造安全可靠、优质高效的电力物资供应链。<\/p>","Transfer":"","coord":"69.800000,32.440000,99.420000,32.440000,99.420000,55.340000,69.800000,55.340000"},{"contentid":774042,"yinti":"","title":"光伏铺沃野","subtitle":"","yinwen":"","author":"刘宇 摄","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    8月5日，在江西南昌县黄马乡官田村“渔光一体”光伏电站，连片光伏板在阳光下熠熠生辉。该电站年均发电量2400万千瓦时，带动村民每年人均增收超2000元。当地供电公司在电站建设期间提前规划并网线路、优化接入方案，在项目投运后常态化开展设备巡检运维，保障电站安全稳定运行。<\/p>","Transfer":"","coord":"49.920000,74.860000,51.570000,61.100000,51.570000,70.790000,64.210000,70.790000,64.210000,61.100000,64.210000,59.830000,64.210000,58.290000,49.920000,58.290000,49.920000,51.690000,0.620000,51.690000,0.620000,74.860000,49.920000,74.860000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/98fed45d-7f09-4ae9-8606-db0e0d24f650.jpg.1","text":""}]},{"contentid":774043,"yinti":"","title":"紧抓窗口期 集中检修高原县城配网线路","subtitle":"","yinwen":"","author":"付艳云","content":"<p>    青海同德县坐落在平均海拔3600米的青藏高原北麓，畜牧业是当地的支柱产业。近年来，当地畜牧产业电气化转型加速，对供电可靠性提出了更高要求。<\/p><p>    7月中旬开始，当地牧民陆续进山转场放牧，产业用电进入低谷窗口期。同德县供电公司党委组建党员突击队，于7月20～27日对10千伏同二路、北二路、北三路、北四路4条线路开展集中检修，及时消除线路隐患，进一步提升同德县城区配网安全运行水平，为高原畜牧业电气化稳步发展保驾护航。作业期间，队员们通过负荷转接的方式保障沿线居民正常用电不受影响。<\/p><p>    7月20～24日，党员突击队完成了同二路全线，以及北二路、北三路部分线段旧导线、老化配件的批量更换工作。7月25日，检修迎来任务最繁重、风险点最集中的攻坚节点，队员们需要完成北三路99～108号杆换新、北四路老旧联络分支全线升级、东大街2号公网变压器移位3项重点任务，现场作业涉及点位多，交叉作业量大。<\/p><p>    “今天作业点附近商铺、宾馆、居民小区分布密集，空间有限，安全风险点较多，大家一定要注意规范操作。”7月25日7时，队员们集结完毕，现场总负责人王勃召开班前会，细化人员分工，明确安全风险管控要点。<\/p><p>    7时35分，安全措施全部落实到位，队员们分为两组开展负荷转接作业。“拉开东大街1号公网变压器低压开关，发电车接在501刀闸1号杆位置。”随着指令下达，第一组队员精准对接应急发电车电缆，另一组队员依次断开丽塘小区专用变压器高低压开关，将小区全部用电负荷平稳转接至发电车供电。8时14分，负荷转接完成，线路主体检修正式开始。<\/p><p>    在北三路99～108号杆换新现场，王勃指挥队员们采取人机结合的方式开展作业。挖掘机辅助破碎硬土、规整基坑，吊车平稳起吊新电杆……队员们紧随机械作业节奏，扶正杆体、微调垂直角度、分层夯实基座，完成了电杆换新。<\/p><p>    10千伏北四路联络分支12号杆T接东大街2号公网变压器移位作业同步推进。该台区紧邻主干道，人流车流络绎不绝且施工场地狭小。为减少施工对交通的影响，王勃在现场划定专属作业区域并增设安全围挡，还安排专人负责疏导交通。杆坑开挖、电杆组立、变压器拆装、引线排布、相序核对……在狭小的作业区域内，14名队员默契配合，稳步推进各道工序。12时45分，变压器移位作业顺利完工。<\/p><p>    200米外的北四路老旧联络分支升级作业也遇到了难题：受高原风沙长年侵蚀，该分支线路多处金具锈死粘连，老化金具部分嵌进导线表层，强行拆卸易造成旧导线大幅度摆动。“用除锈剂充分浸润锈蚀金具后，再用绳索固定导线弧垂，接着逐组拆除悬垂线夹、耐张金具与旧横担。”王勃迅速给出处置方案。队员们小心配合着拆解金具，并顺利更换构件和旧导线。<\/p><p>    20时52分，当日所有作业任务顺利完工。21时，作业涉及的线路、公网变压器恢复正常运行。7月26～27日，党员突击队有序完成了剩余的0.4千伏东大街1号公网变压器1号杆扶正等收尾工作。至此，此次配网线路集中检修任务全部完成。<\/p>","Transfer":"","coord":"69.800000,61.240000,99.420000,61.240000,99.420000,99.580000,69.800000,99.580000"},{"contentid":774044,"yinti":"","title":"“带电飞人”一机多用，高空作业安全高效","subtitle":"","yinwen":"","author":"唐慧宝","content":"<p>    8月3日，在辽宁鞍山220千伏红旗堡变电站实训基地，鞍山供电公司输电工区青年员工刘炳初应用该公司自主研发的“带电飞人”电动升降装置组合工具，用时15分钟便平稳升至27米高的导线位置。单次作业时长较以往缩短20分钟，安全风险大幅降低。<\/p><p>    输电线路等电位带电作业是保障电网不间断供电的重要手段。以往开展220千伏及以上线路等电位带电作业时，作业人员主要使用传统软梯或老式怀抱式电动升降装置进入电场。使用传统软梯时，作业人员须徒手攀爬数十米高的铁塔，体力消耗大，且高空停留时间较长，风险较高。使用老式怀抱式电动升降装置时，由于设备进绳口位置偏低，作业人员升空换位时容易重心偏移，使装置产生晃动，且牵引绳从人员胸前穿过，长期作业易造成绳索磨损、卡滞。此外，两种作业模式均需提前布设牵引绳。现有布设方式存在短板：人工登塔使用绝缘杆挂设绳索的高空操作烦琐；作业人员操纵无人机抛绳挂设时，需要反复校准绳体位置，效率不高。<\/p><p>    2023年6月，鞍山供电公司青年创新攻坚小组立足一线作业痛点，启动“带电飞人”电动升降装置组合工具研发攻关。成员们梳理了省内300余次带电作业现场记录，锁定牵引绳挂设烦琐、装置运行不稳定两个痛点问题，确定“分体组合、结构优化、防脱闭锁”的整体研发思路，并结合无人机现场布设场景开展适配性设计。<\/p><p>    针对痛点问题，攻关团队逐项完成装置结构的迭代优化。团队首先研制出四爪内勾式牵引绳拆挂装置，可搭配无人机实现空中一次性挂绳作业。“这就像给无人机装了一只灵活的‘手’，即便在大风天气也能牢牢抓住导线，省去了人工登塔反复调整绳索的步骤。”团队成员刘永威介绍。针对老式升降设备易晃动的问题，成员们重新规划升降主机内部布局，在保持整机外形尺寸不变的基础上，将进绳口位置抬高60厘米，让牵引绳从升降装置主机上端走线，避免了以往胸前穿绳造成的摩擦损耗；采用一体式成型结构替代传统的分体怀抱式结构，并内置防脱限位件，以减少人员升降、换位时的装置晃动。<\/p><p>    “新装置不仅解决了安全和效率问题，还实现了‘一机多用’。”据刘炳初介绍，这套装备既能用于等电位检修，也能作为登塔防坠保护，还能在高空救援中派上用场，降低了班组的工器具储备成本。<\/p><p>    2024年5月，“带电飞人”电动升降装置组合工具在500千伏唐王二线开展试点验证。现场实测数据显示，作业人员使用该装置进入电场仅需15分钟，作业效率提升57%，体力消耗降低40%以上；全程未出现装置晃动、绳索卡磨等问题，挂设、升降操作一次完成，设备运行稳定可靠。同时，装置闭锁结构有效规避了高空松脱隐患，期间未出现任何异常。<\/p><p>    截至目前，“带电飞人”电动升降装置组合工具已在鞍山供电公司输电作业现场累计应用200余次，累计节省作业时间约273小时，多送电量189.2万千瓦时。该装置于今年5月在国网辽宁省电力有限公司第八届青年创新创意大赛中获得金奖。<\/p>","Transfer":"","coord":"0.410000,77.670000,63.790000,77.670000,63.790000,99.440000,0.410000,99.440000"}]},"page_5":{"board_id":147834,"board_num":"5","alias":"党建","img_url":"338989e0-655b-4bf5-a9b1-63bc0c12d078.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/883863e2-04f2-4363-bcf5-aa1fffbb350f.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774045,"yinti":"","title":"持续推动学习贯彻习近平党建思想走深走实","subtitle":"","yinwen":"","author":"清华大学马克思主义学院院长 朱安东","content":"<p>    治国必先治党，党兴才能国强。习近平党建思想集中体现了新时代党的建设理论创新、实践创新、制度创新成果，为加强新时代党的建设提供了根本遵循。当前，我国发展机遇与挑战交织，改革发展稳定任务艰巨繁重。唯有持续深学细悟笃行习近平党建思想，坚持学思用贯通、知信行统一，把理论力量转化为管党治党的实践成效，才能不断开辟管党治党、兴党强党新境界，为以中国式现代化全面推进强国建设、民族复兴伟业提供根本政治保证。<\/p><p>    深刻把握习近平党建思想的理论体系与内在逻辑，增强贯彻落实的思想自觉<\/p><p>    思想是行动的先导。学习贯彻习近平党建思想，首要任务是深刻理解和科学把握这一重要思想的科学内涵、逻辑架构与时代价值，做到系统把握、融会贯通，增强贯彻落实的思想自觉。<\/p><p>    把握理论源流，领会这一重要思想对马克思主义建党学说的创新发展。马克思主义建党学说指引着无产阶级政党建设的前进方向。百余年来，我们党坚持“两个结合”，不断深化对马克思主义政党建设规律的认识。习近平党建思想坚持和发展马克思、恩格斯和列宁的建党学说，以及我们党在不同历史阶段的党的建设的理论，立足新时代世情国情党情的深刻变化，回答新时代党的建设面临的重大理论和实践问题，实现了对马克思主义建党学说的创新发展。这一重要思想围绕执政规律、使命担当、肌体建设等提出了一系列原创性论断，丰富发展了马克思主义建党学说的基本原理，为世界政党治理贡献了中国智慧。学习贯彻这一重要思想，要把握其一脉相承、与时俱进的理论创新过程，在理论发展史的视野中领会其理论品格。<\/p><p>    把握科学体系，领会这一重要思想的系统性与整体性。习近平党建思想博大精深、内涵丰富，构成一个系统完整、逻辑严密的理论体系，集中体现为“十四个坚持”。“十四个坚持”，深刻把握管党治党、兴党强党与强国复兴的内在联系，统筹党的领导和党的建设，构成环环相扣、内在统一的有机整体，有着清晰严谨的内在逻辑。前四个坚持立足顶层设计，明确根本原则和战略方向，起到统领全局的作用；后十个坚持聚焦党的建设各领域具体工作，是落地见效的基础支撑。这集中体现了习近平总书记关于新时代党的建设的新理念新思想新战略。唯有整体把握、融会贯通，才能真正吃透精神实质，避免学习流于片面、认识出现偏差。<\/p><p>    立足时代方位，领会这一重要思想强烈的使命担当和鲜明的问题意识。大党执政，既有规模优势，也面临特有考验。“四大考验”“四种危险”长期存在，新时代党的建设必须直面这些现实挑战。习近平党建思想精准研判长期执政条件下党内存在的风险隐患，直面管党治党薄弱环节与突出问题，既关注整治当下的顽瘴痼疾，又着眼长远夯实执政根基，展现出强烈的使命担当，兼具问题导向、系统思维与战略眼光，为党永葆生机活力提供了“金钥匙”。我们要始终保持清醒和坚定，自觉以科学理论校准航向，坚决清除一切弱化党的先进性、损害党的纯洁性的因素，确保党永远不变质、不变色、不变味。<\/p><p>    深刻把握管党治党的实践着力点，增强贯彻落实的实践自觉<\/p><p>    习近平党建思想明确了新时代党的建设的科学布局、重点任务与实践路径。贯彻落实这一重要思想，就要抓纲带目、精准施策，自觉运用这一重要思想谋划和推进党的建设，把严的标准、严的要求贯穿党的建设各领域、各环节，把这一重要思想转化为具体政策、具体任务、具体措施，把我们党建设好、建设强。<\/p><p>    以党的政治建设为统领，夯实对党忠诚的政治根基。旗帜鲜明讲政治，是马克思主义政党的根本属性，也是我们党百余年奋斗形成的独特优势。党的政治建设居于统领地位，决定党的建设方向与成效。必须把坚持党中央集中统一领导作为党的领导的最高原则，深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”。政治忠诚体现在贯彻落实党中央决策部署的行动中，体现在履职尽责的实效里，体现在日常言谈举止上。党员干部要不断提高政治判断力、政治领悟力、政治执行力，善于从繁杂事务中发现政治端倪，在复杂矛盾关系中把握政治逻辑，确保政治立场不移、政治方向不偏，不折不扣把党中央决策部署落到实处。<\/p><p>    以理论武装为基础，补足共产党人精神上的“钙”。思想建设是党的基础性建设，用党的创新理论武装全党是固本培元、凝聚共识的根本任务。要坚持用习近平新时代中国特色社会主义思想武装头脑、指导实践、推动工作，推动党员干部读原著、学原文、悟原理，完整准确把握党的创新理论的世界观、方法论和贯穿其中的立场观点方法。健全常态化制度化学习机制，依托党委（党组）理论学习中心组、“三会一课”、主题党日、集中轮训等，构建分层分类、全域覆盖的学习格局。大力弘扬优良学风，将理论学习与党性锤炼、实践探索、难题破解紧密结合。<\/p><p>    以党性锤炼为根基，筑牢共产党人立身之本。党员干部立身、立业、立言、立德，基石是党性。有了坚强的党性，就能自觉站在党和人民立场上，为党分忧、为民造福；就能在面对大是大非时旗帜鲜明，自觉抵制各种歪风邪气。坚强的党性不是与生俱来的，也不是一劳永逸的，而是要以永远在路上的精神不断淬炼和磨砺。中国共产党人的党性建立在科学清醒的理论认知基础之上。要学深悟透习近平总书记关于党性的重要论述，从理论源头上把握党性对共产党人务实作风、担当精神、纪律意识等方面的基础性作用，全面理解和把握党性的要求。实践锻炼对党性涵养至关重要。必须自觉在重大斗争中磨砺党性，在推动高质量发展、推进乡村全面振兴等重大任务中苦干实干、攻坚克难，竭尽全力完成党交付的职责和任务。<\/p><p>    以组织体系建设为重点，锻造坚强有力的干部队伍。党的力量来自组织，严密的组织体系是我们党攻坚克难的优势所在。深入贯彻新时代党的组织路线，健全上下贯通、执行有力的组织体系，全面增强党组织政治功能和组织功能。坚持大抓基层的鲜明导向，统筹推进农村、社区、机关、国企、学校、新业态新群体等领域党建工作，持续整顿软弱涣散基层党组织，推动基层党组织在乡村振兴、基层治理、应急处突、为民服务中当好战斗堡垒。严格落实党管干部、党管人才原则，恪守新时代好干部标准，树立重实干、重实绩、重担当的用人导向。注重在重大斗争一线磨砺干部，加强思想淬炼、政治历练、实践锻炼、专业训练，全面提升干部综合能力。规范党员教育、管理、发展全流程，充分发挥党员先锋模范作用，让整个组织体系筋骨强健、充满活力。<\/p><p>    以正风肃纪反腐为抓手，持续净化党内政治生态。纪律严明是我们党的光荣传统。始终把严的基调、严的措施、严的氛围长期坚持下去，锲而不舍落实中央八项规定及其实施细则精神，紧盯形式主义、官僚主义隐形变异问题，持续为基层减负，严防“四风”反弹回潮。全面加强纪律建设，将党章党规党纪作为必修课，引导党员干部知敬畏、存戒惧、守底线，让铁的纪律成为行动自觉。坚持一体推进不敢腐不能腐不想腐，做到同时发力、同向发力、综合发力。保持反腐败高压态势，严查重点领域腐败和群众身边“微腐败”；完善权力制约监督体系，扎紧制度笼子；加强廉洁文化建设与警示教育，筑牢拒腐防变思想防线。深化风腐同查同治，持续净化党内政治生态。<\/p><p>    以制度治党、依规治党为保障，提升管党治党规范化水平。制度治党、依规治党是全面从严治党的长远之策、根本之策。健全全面从严治党体系，必须做到内容上全涵盖、对象上全覆盖、责任上全链条、制度上全贯通，推动党的各项建设有机衔接、协同发力。结合新时代党的建设实践，持续完善党内法规制度体系，形成系统完备、科学规范、运行有效的制度链条。制度的生命力在于执行，要强化党员干部的制度意识，推动其自觉尊规、学规、守规、用规。领导干部要带头执行制度、维护制度权威。健全制度执行监督与追责机制，对有令不行、有禁不止的行为严肃问责，让制度成为不可逾越的硬约束，以制度保障管党治党常态长效。<\/p><p>    压实管党治党责任，以严实标准推动责任落地。落实管党治党责任是各级党组织的核心政治任务。强化守土有责、守土负责、守土尽责的意识，细化党建责任清单，推动责任层层传导、层层压实。优化考核评价导向，将考核重点从工作痕迹转向实际成效和群众评价，提升考核科学性。坚持严管和厚爱结合、激励和约束并重，营造实干担当的良好干事氛围，对责任悬空、落实不力的严肃追责问责，以刚性约束推动管党治党责任落地生根。<\/p><p>    秉持改革精神与系统思维，推动全面从严治党向纵深发展<\/p><p>    深入学习贯彻习近平党建思想，必须坚持守正创新、久久为功，以改革办法破解难题，以系统思维统筹全局，推动全面从严治党向纵深发展。<\/p><p>    以改革创新破解党的建设实践难题。与时俱进、守正创新是马克思主义政党的鲜明品格。面对新形势、新任务、新挑战，要坚持以改革精神推进党建工作，运用新理念、新思路、新举措化解各种矛盾和问题，不断提升管党治党实效。深化党的建设制度改革，以实践基础上的理论创新推动制度创新，补齐制度短板，以制度建设成效巩固管党治党成果，提升治国理政效能。尊重基层首创精神，鼓励基层党组织在把握正确政治方向前提下大胆探索创新，打破思维定式与路径依赖，及时总结推广基层好经验、好做法，让党的建设始终与时代发展同频共振。<\/p><p>    以系统观念统筹全面从严治党全局。健全全面从严治党体系，要坚持运用系统观念统筹推进各项工作。坚持一体推进党的政治建设、思想建设、组织建设、作风建设、纪律建设、制度建设和反腐败斗争，推动各领域工作衔接联动、同向发力。把理论武装作为固本培元的基础工程常抓不懈，推动政治监督、组织管理、执纪问责、责任落实贯通融合，构建全方位、多层次的管党治党格局。补齐工作短板、强化薄弱环节，推动全面从严治党实现标本兼治、整体提质。<\/p><p>    以常态长效推动学习贯彻走深走实。依托各类宣传阵地、教育平台，全方位宣传阐释习近平党建思想，讲清楚这一重要思想的重大意义、丰富内涵、精神实质、科学体系、核心要义、实践要求，讲清楚这一重要思想的原理性成果、原创性贡献，使党员干部既知其然，又知其所以然，更知其所以必然。常态化开展理论研讨、经验交流、实践观摩活动，深入挖掘选树先进典型，发挥榜样示范引领作用，引导广大党员干部对标先进、争先创优。在全党营造重视党建、研究党建、抓实党建的浓厚氛围，以常态长效的工作思路持续推动学习贯彻习近平党建思想走深走实。<\/p><p>    立足新时代新征程，我们要坚持以习近平党建思想为根本遵循，一以贯之推进全面从严治党，持之以恒深化党的建设，把理论力量转化为管党治党、干事创业的强大动能，不断开辟管党治党、兴党强党新境界，确保党始终走在时代前列、得到人民衷心拥护、经得起各种风浪考验，团结带领人民在全面建设社会主义现代化国家的征程上稳步前行。<\/p><p>    （本文摘自7月28日《人民日报》9版）<\/p>","Transfer":"","coord":"0.620000,9.550000,99.420000,9.550000,99.420000,58.150000,0.620000,58.150000"},{"contentid":774046,"yinti":"","title":"高原之上铸高峰","subtitle":"","yinwen":"国网青海电力党委以思想铸魂、组织强基、行动引路，围绕中心工作开展党建实践，以高质量党建引领高质量发展。","author":"周磊 余丽丽","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    “两弹一星”精神是中国共产党人精神谱系的重要组成部分，青海是“两弹一星”精神的孕育地之一。立足新型电力系统省级示范区建设，国网青海省电力公司党委将传承弘扬“两弹一星”精神作为着力点，大力实施“高原之上铸高峰”党建实践，以政治思想引领、组织作用强化、党员示范提升为抓手，推动党建工作与业务工作同频共振。<\/p><p>    发挥思想引领作用<\/p><p>    国网青海电力党委坚持把学习领悟党的创新理论作为首要政治任务，严格落实党委会“第一议题”制度，实施中心组学习质量提升专项行动，引导广大党员干部筑牢信仰之基、把稳思想之舵。该公司党委开展“三会一课”巡听旁听工作，建立党支部月度学习清单，开设名师大讲堂，组建“双语”宣讲团，以分层分类、精准施教的方式，推动党的创新理论进基层、进一线、进班组。<\/p><p>    青海拥有中国第一个核武器研制基地、中国工农红军西路军纪念馆等众多红色资源。国网青海电力党委依托当地红色资源，深入挖掘、梳理历史资料，建成“两弹一星·电力传承”党性教育基地，挂牌成立青海省“两弹一星”教育学院电力实践基地。在此基础上，该公司党委以“从东方巨响到绿色交响”为主题，打造精品党课和系列文化作品，引导干部员工传承弘扬“两弹一星”精神，做实做优本职工作。<\/p><p>    “这把旧扳手，当年在零下30摄氏度的戈壁滩上，陪伴老一辈电力人守护核武器研制基地的用电安全……”4月3日，在我国第一个核武器研制基地——国营二二一厂旧址，四分厂基地讲解员指着展柜里的老物件，向海北供电公司党员们讲述老一辈电力人艰苦奋斗的事迹。当天，该公司党委在这里举办“缅怀英烈慰忠魂 踔厉奋发新征程”主题党日活动，此次活动也是国网青海电力党委组织的“老物件里的精神密码”系列活动之一。<\/p><p>    既要从历史中汲取力量，也向身边榜样看齐。国网青海电力党委挖掘全国劳动模范、国网青海超高压公司变电检修中心四级职员钱建华的典型事迹，打造了集理论宣讲、教育服务、科技科普、创新实践等功能于一体的新时代文明实践基地。依托这一基地，国网青海电力党委常态化开展“党课开讲啦”“廉洁教育进基层”等活动，一体推进理论学习、党性锤炼、文明实践。<\/p><p>    建强基层战斗堡垒<\/p><p>    2024年11月20日，青海省“十四五”电力发展规划重大项目——750千伏羚羊输变电工程开工建设。面对海拔高、工期紧、沿线地质复杂等挑战，青海电力建设公司党委把支部建在项目上，鼓励党员带头解难题、保安全。<\/p><p>    青海电力建设公司党委以项目为单元，成立临时党支部，下设业主、设计、施工、监理等临时党小组，推行党建联建、阵地联用、安全联控、技术联创，保障重大工程高效推进。“我们与工程各参建单位积极沟通，制订党建共建实施方案，以党建引领推进电网工程安全建设。”该公司工程管理部现场项目经理、党员示范岗党员高明说。目前，该工程已进入建设冲刺阶段，各作业面施工有序开展。<\/p><p>    750千伏羚羊输变电工程的党建实践并非个例。国网青海电力党委持续深化“高原电网星级堡垒党支部”创建评价工作，实行星级堡垒党支部评定、复审、降级和摘牌等机制，激发基层党建活力。结合重点工程、重要任务，该公司基层党委第一时间组建临时党支部，以钉钉子精神抓严抓实基层党建工作，将临时党支部建设与工程管理同部署、同推进。<\/p><p>    西宁供电公司所属区县级供电公司、供电中心党支部探索开展“红爱满城·社警电”融合服务，推行“居民点单、网格派单、社警电接单”的服务模式，实现需求响应一站协同、服务力量一体联动。海西供电公司党委组织基层党支部开展“绿色交响·厂网共建”活动，与当地170余家新能源企业党组织结对共建，有针对性地提供场站并网、设备运维、故障处置等方面的技术帮扶。国网青海电力各基层党组织通过开展“一支部一特色”创建工作，持续创新服务路径，将组织优势转化为发展动能。<\/p><p>    汇聚党员先锋力量<\/p><p>    2月11日，巴颜喀拉山上，气温低至零下30摄氏度。当天，4名国家电网青海电力三江源（送变电）共产党员服务队队员在这里巡检330千伏玉树二回线路工程。他们克服高寒缺氧等困难，完成了11基铁塔、5.8千米线路的巡检任务。<\/p><p>    一名党员就是一面旗帜。国网青海电力党委持续擦亮“三江源”共产党员服务队金色名片，聚焦电力保供、便民服务、应急处置等任务，构建“党委统领、支部牵头、党员带头”的服务体系。今年春节前后，1600余名党员服务队队员深入农牧区，向农牧民讲解安全用电知识，开展电力设备隐患排查、故障处置等工作。<\/p><p>    青海地域辽阔，人口分布不集中，供电服务难度较大。为此，国网青海电力党委面向偏远地区农牧民推行“石榴籽”电力流动服务驿站新模式。以党员服务队队员为主体的“石榴籽+”网格员主动靠前，为客户提供业扩报装、装表接电、故障处理、用电咨询、电力政策宣传等服务，及时解决用电问题。<\/p><p>    国网青海电力党委深化“岗区队”联动创效工作，加强党员示范岗、责任区、突击队日常管理，聚焦电力保供、电网建设、科技创新、优质服务等重点工作开展“岗区队”创建活动，组织“示范先行”“责任有我”“请战冲锋”等专项行动，让党员在关键时刻发挥关键作用。<\/p>","Transfer":"","coord":"0.410000,59.550000,99.420000,59.550000,99.420000,99.440000,0.410000,99.440000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/3c5c6939-0dcf-443e-9cee-c3686fc75f2c.jpg.1","text":"    党员服务队队员滑索过河，巡检线路。张雪 摄"}]}]},"page_6":{"board_id":147835,"board_num":"6","alias":"世界一流企业","img_url":"4502e785-5387-4b10-a00f-d9791967a784.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/26c56060-f066-4f88-b75b-b0c0c6bf862f.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774047,"yinti":"","title":"强基固本 向新突破","subtitle":"——国网宁夏电力以价值创造赋能企业高质量发展","yinwen":"","author":"李莹洁","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    8月3日，宁夏750千伏星塘输变电工程跨越银昆高速跨线防护网拆除作业完成。本次施工中，宁夏送变电工程有限公司放线班班长赵金刚带领班组员工，借助可视化集成放线装置完成牵张设备操控、导地线展放工作，实现牵张放线关键工序自主实施。<\/p><p>    近年来，国网宁夏电力有限公司将建设世界一流企业作为系统性工程，坚持顶层设计与基层实践相结合，围绕核心班组建设、三项制度改革等重点领域精准施策，以精益管理夯实基础，以提升核心业务自主实施能力彰显价值，以科技创新锻造竞争优势，支撑电网和企业高质量发展。<\/p><p>    建强核心业务班组<\/p><p>    激活基层内生动力<\/p><p>    班组是企业生产经营的“最小单元”，其核心业务能力直接关系电网安全运行和优质服务水平。国网宁夏电力将核心业务班组建设作为提升企业核心竞争力的先手棋。2025年4月，该公司印发《核心业务班组建设专项攻关行动方案》，从规范劳动组织、配齐配强人员、强化人才培养、健全考评机制等11个方面系统构建班组建设长效机制。<\/p><p>    针对一线员工工作量化难、主观评价易偏差等问题，方案明确每季度考核核心业务班组人员，将考核结果分为优秀、良好、合格、不合格4个等级，并与薪酬待遇分档挂钩。在此基础上，该公司坚持“业务工单化、工单价值化、价值绩效化”，围绕业务量、工作质效、安全生产3个维度建立市场化绩效评价体系；依托运检移动作业平台，按照人员角色、作业时段、风险等级、工作难易等因素设置权重系数，以积分量化工作量并兑现绩效薪资。<\/p><p>    在组织保障方面，国网宁夏电力成立核心业务班组建设领导小组，董事长、总经理任组长，工会主席任常务副组长，其他领导班子成员任副组长，各部门主要负责人为成员。该公司企管部、工会负责总体组织协调，设备、配网、营销、数字化、建设、调控等部门负责本专业班组建设，组织、财务、安监、后勤、产业办等部门负责专业保障。在运行机制方面，各专业部门对照核心业务清单逐项梳理班组能力短板，制订针对性提升计划。在考核激励方面，该公司将核心业务班组建设达标率列为硬性考核指标，按季度跟踪问效、闭环管控。<\/p><p>    随着“干多干少不一样、干好干坏不一样”的激励导向深入人心，国网宁夏电力核心业务班组内生动力得到进一步激发。一线员工抢工单、练技能的氛围日益浓厚，核心业务自主实施水平稳步提升，现场安全管控与应急处置能力不断增强，核心业务“干得精”已成为班组的行动自觉。<\/p><p>    畅通绿电外送通道<\/p><p>    促进资源优化配置<\/p><p>    2025年10月8日，±800千伏宁夏—湖南特高压直流输电工程（以下简称“宁电入湘”工程）双极高端直流系统完成168小时试运行，正式投入商业运行。该工程每年可向湖南输送电量超360亿千瓦时，其中新能源电量占比超50%。宁夏电力外送能力从1400万千瓦提升至2200万千瓦。<\/p><p>    “宁电入湘”工程的建设难度堪称“世界级”：与已建、在建特高压线路交叉11次，跨越黄河、长江等通航河流14条，跨越高铁9次、电气化铁路14次、高速公路36次，跨越各电压等级输电线路187次。面对复杂的施工条件，国网宁夏电力自主研发出适用于多种场景的全地形自立式跨越架，实现带电跨越施工与适应复杂地形的双重突破。应用该成果后，以往需要2天完成的跨越架搭设作业缩短至1小时，施工人员减少60%。<\/p><p>    工程顺利投运离不开国网宁夏电力多年的技术积累。由国网宁夏电力经济技术研究院牵头完成的“‘沙戈荒’新能源经特高压直流送出关键技术及工程”项目，形成覆盖“电源—电网—直流”的全链条解决方案，相关成果获得29项国家发明专利授权，为“宁电入湘”工程从蓝图变为现实提供了可靠技术支撑。<\/p><p>    在建设特高压通道的同时，国网宁夏电力虚拟电厂的“软调节”能力同步增强。针对宁夏新能源装机快速增长带来的调峰压力，该公司构建“政府主导、电网统筹、多方参与”的虚拟电厂建设机制。截至今年7月，虚拟电厂管理平台总聚合资源可调容量突破125.29万千瓦，累计增加新能源消纳电量8175万千瓦时，相当于减少标准煤燃烧2.7万吨。<\/p><p>    深耕技术标准研制<\/p><p>    锻造核心竞争优势<\/p><p>    今年4月，国网宁夏电力牵头申报的电气电子工程师学会（IEEE）国际标准P5002《算力中心可信数字用能记录架构标准》获批立项，标志着我国在算力中心绿色用能领域迈出关键一步。这是该公司首次牵头制定IEEE国际标准。<\/p><p>    大型算力中心年耗电量可达数亿千瓦时，被形象地称为“不冒烟的工厂”。许多运营方希望使用绿电实现低碳运行。但绿电缺乏统一、可信的用能数据记录及追溯方法，现有技术标准主要关注供电可靠性、设备安全性和能效等指标，对用电数据的真实性、可追溯性和防篡改性缺乏系统性规范。此次获批的《算力中心可信数字用能记录架构标准》为大型算力中心建立了一套通用的“能源账本”，为每一度绿电消耗提供可靠证明，为绿电交易和碳排放核算夯实数据基础。<\/p><p>    这项国际标准由国网宁夏电力牵头申报并非偶然。中卫市是国家新型互联网交换中心和全国一体化算力网络国家枢纽“双节点”城市，也是国家“东数西算”工程八大枢纽节点之一。同时，当地新能源装机占比超过一半，大型算力中心就近使用绿电的条件得天独厚。<\/p><p>    近年来，国网宁夏电力在技术标准领域持续发力，既瞄准能源新业态的前沿需求，也聚焦电网核心业务新型技术应用的规范统一。2025年9月，该公司参与编制的IEEE国际标准《变电站巡检用无人机推荐使用方法》正式发布。该标准规定了变电站无人机巡检的系统组成、技术条件、操作人员资质、环境要求等内容，为全球变电站无人机巡检提供了统一的技术依据。<\/p><p>    目前，国网宁夏电力累计参与编制国际标准3项，牵头或参与编制国家标准40项、行业标准71项。<\/p>","Transfer":"","coord":"0.210000,3.650000,63.170000,3.650000,63.170000,69.380000,0.210000,69.380000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/3e1357eb-1065-4832-9bd4-fe4d9155a558.jpg.1","text":"    宁夏银川供电公司输电运检中心员工带电检修110千伏高良线，保障线路可靠运行。袁宏彦  摄"}]},{"contentid":774048,"yinti":"","title":"定好标准培育人才 用活工具减负增效","subtitle":"","yinwen":"国网信通中心（大数据中心）安全生产部","author":"刘洋","content":"<p>    核心业务自主实施、专业人才能干会管是保障生产安全、提升企业核心竞争力的关键抓手。国家电网有限公司信息通信中心（大数据中心）安全生产部牵头组织各专业部门从能力标准制定、人员技能培养、智能化工具建设3个维度精准发力，推动核心业务向“自主可控、提质增效”转型升级。<\/p><p>    面对以往能力标准不统一、员工技能水平不均衡等问题，安全生产部构建了基础能力及专业能力培养体系，细化各岗位应掌握的知识技能、成长路径及考核评价标准。目前，该体系已覆盖规划建设、调度运行、运维运营、网络与数据安全、客户服务、新技术应用等专业。依托该体系，员工能力培养实现“学什么、会什么、达到什么水平”的精准对标，为技能水平的规范化提升奠定基础。<\/p><p>    为推动能力标准落地、锻造过硬队伍，安全生产部统筹各专业部门依托自建实训室、仿真平台等资源，分专业搭建沉浸式实操环境，帮助员工夯实基础操作、常见缺陷处置等基本功，补齐能力短板；建立“学、练、考、评、改”闭环机制，常态化开展全员岗位技能大练兵，既检验培训成效，又精准摸排技能薄弱环节。年初至今，该中心已组织开展专业练兵20余场，覆盖600余人次。<\/p><p>    此外，安全生产部推动各部门打造一系列自动化、智能化工具，将重复性、标准化工作交由工具自动完成，让员工有更多精力聚焦核心业务攻坚与复杂问题处置。依托这些工具，相关专业部门实现了业务系统上线红线指标自动检查、数据库表空间及归档日志告警一键处置、系统功能一键巡检等，大幅提升了运维效率，有效规避了人工操作风险。<\/p><p>    通过标准化筑基、实战化练兵、智能化赋能“三位一体”推进，安全生产部牵头构建起可复制、可推广的核心业务自主化能力提升体系，实现“能力有标准、队伍有本领、运维有工具”。<\/p>","Transfer":"","coord":"67.940000,6.180000,99.420000,6.180000,99.420000,33.010000,67.940000,33.010000"},{"contentid":774049,"yinti":"","title":"优化劳动组织模式 提升输电运检质效","subtitle":"","yinwen":"冀北廊坊供电公司输电运检中心","author":"王少坤","content":"<p>    冀北廊坊供电公司输电运检中心负责供区内35千伏至500千伏共5300余千米输电线路的运维检修管理工作。为提升运检效率，今年年初，该中心以设备主人制为核心，以数智化转型为抓手，全面优化劳动组织模式，推动输电运检从人工经验驱动向数据工单驱动转变。<\/p><p>    输电运检中心打破原有班组业务壁垒，组建输电集中监控班，将其作为全景监控指挥中枢。监控班依托“可视化装置+在线监测+无人机巡检”立体感知网络，整合架空线路、电缆通道、无人机等多源数据，实现设备本体状态与通道环境的自动感知与智能研判。监控班设置桌面巡检、预警分析、数据研判、风险督查、设备维护5个核心岗位，将过去分散的人工研判转变为集中化、标准化的智能决策。针对任务派发后存在超时完成的问题，该中心建立智能工单系统，将工单进行统一管理，实现“隐患识别—智能派单—现场处置—验收归档”全流程闭环，显著提升隐患处置响应速度和闭环管控质效。<\/p><p>    以往，不同电压等级线路分开管理，运维检修资源分散、协同不足的问题一度影响作业效率。输电运检中心整合全部输电运检任务，按照区域组建7个全电压运检班，统一承担35千伏至500千伏线路的运检任务，实现人员、装备跨电压等级灵活调配。该中心还扩大带电作业班规模，将因智能巡检释放的10余名运维骨干转岗至核心技能岗位负责带电消除缺陷、处置复杂故障等。该中心员工将更多精力投入到设备状态评估、缺陷跟踪分析、技术方案制订等工作中，实现从简单巡检向综合技术判断升级。<\/p><p>    为进一步压实责任，输电运检中心优化班组职责划分，明确通道专项巡检、全业务巡检、智能巡检支撑、电缆专业化运检等专业分工，逐线逐塔落实“设备主人+三级巡护”责任制，确保每一基铁塔、每一段通道都有人负责、有人监督、有人考核。在人才培养方面，该中心优化岗位设置，丰富岗位内涵，对转岗人员严格执行“先培训、后上岗”制度，将无人机操作、可视化系统应用、数据分析研判等技能纳入岗位必备要求。该中心还建立差异化绩效考核机制，将数字化工具应用成效、跨专业协同质量、工单闭环效率等指标纳入月度考核，将考核结果与绩效薪酬直接挂钩，让责任落实与工作成效紧密关联，推动输电运检体系规范高效运转。<\/p>","Transfer":"","coord":"67.940000,35.670000,99.420000,35.670000,99.420000,66.710000,67.940000,66.710000"},{"contentid":774050,"yinti":"","title":"强网架 优服务 提效能","subtitle":"","yinwen":"湖北老河口市供电公司发展建设部","author":"郭峰","content":"<p>    湖北省老河口市现有16座变电站，形成以220千伏老河口变电站为中心主供电源、110千伏线路为骨架、110千伏和35千伏变电站为网点的高压电网结构，直供客户21.75万户。老河口市供电公司发展建设部以“优化网架结构、提高供电质量”为核心目标，聚焦电网发展建设、数智运维及电力营商环境优化等重点领域，统筹推进规划落地、项目建设和管理提升，为老河口市经济社会高质量发展提供坚强电力保障。<\/p><p>    发展建设部围绕网架结构强化和发展建设规划，实施“网架从优、容量从紧、项目从效”策略，建立“横向协同、纵向贯通”项目管控机制，推动高、中、低压配网协调发展，促进电网发展建设规划项目库与地方国土空间规划深度融合，确保电网建设项目“落得下、建得快”。2025年年底，110千伏酂阳输变电工程顺利投运，新增变电容量10万千伏安，与220千伏老河口变电站一起为城区及产业园区提供双电源供电。“十四五”时期，该公司累计实施207项配网巩固提升工程，2025年年底供电可靠性达99.9747%。<\/p><p>    发展建设部还依托数字化、智能化手段推动运维管控向精益化、精准化转型。2025年，老河口市供电公司作为襄阳市首个县级低压配网调度管理试点单位，创新实施“流程自动化机器人+网络化下令”数智化管控模式，将10千伏单台区及0.4千伏低压设备全面纳入调度管控，实现中低压设备调度管控率与指令正确率均达100%。今年4月以来，该部门构建“调度D5000系统+配电自动化馈线终端+智电小诸葛+停电一张图”智能研判体系，实现电网实时监控与馈线故障分钟级自动定位隔离，故障研判准确率达96.5%，平均复电时长较以往缩短10分钟。<\/p><p>    近年来，发展建设部加快推广“高效办成一件事”，实现“刷脸办电”“一证办电”“联合过户”等线上服务全覆盖。今年2月，酂阳供电所、光化供电服务站全面建成“水电气”共享营业厅，实现公共服务“一站式”办理，截至目前为8500户小微企业和居民客户累计节约办电成本1505.55万元。今年迎峰度夏期间，发展建设部针对当地地理气候特点，持续完善“气象预警+主动运维+应急抢修”联动机制，提升防汛抗灾保电能力。<\/p>","Transfer":"","coord":"67.940000,69.380000,99.420000,69.380000,99.420000,99.580000,67.940000,99.580000"},{"contentid":774051,"yinti":"","title":"从“单兵作战”到“握指成拳”","subtitle":"","yinwen":"为推动关键技术突破与成果转化应用，甘肃电力科学研究院围绕功能定位、学科建设、创新平台、人才队伍深化科技创新体制机制改革，构建协同攻关与成果转化全链条体系，实现——","author":"马宏忠","content":"<p>    近日，在甘肃省新能源并网运行控制重点实验室，甘肃电力科学研究院新能源科技攻关团队围绕“沙戈荒”新能源并网运行关键技术开展联合攻关和成果转化应用。<\/p><p>    “过去科研任务多、专业分散，从需求提出到成果落地，往往需要跨部门、跨环节反复对接。现在有了清单指引、平台支撑和团队协同，攻关方向更清楚，成果落地也更快了。”团队专家吕清泉说。这一变化源于甘肃电科院近年来围绕功能定位、学科建设、创新平台、人才队伍推进的“四位一体”科技创新改革实践。<\/p><p>    随着新型电力系统建设加速推进，甘肃新能源大规模开发外送对技术支撑和成果转化提出了更高要求。甘肃电科院以深化科技创新体制机制改革为突破口，打通规划、科研、平台、人才等环节，构建目标同向、资源统筹、攻关协同、成果可转的创新组织体系。<\/p><p>    改革首先明确“干什么、谁来干、怎么干”。围绕省级电科院职责定位，甘肃电科院编制《优化电科院功能定位进一步推动核心能力建设重点举措》，将重点任务细化至具体部门、岗位和时间节点，建立动态评估和跟踪问效机制。同时，该院实行“核心业务清单”和“支撑业务清单”双清单管理，厘清业务边界，推动科技创新从“点上发力”转向“体系作战”。<\/p><p>    学科建设方面，甘肃电科院紧扣甘肃电网实际需求，与业务部门建立常态化沟通机制，将生产实践中的技术难题转化为科研选题。结合甘肃资源禀赋、区位特点和通道优势，该院在新能源及储能分析、气象学、水利水电工程等方向布局特色优势学科，并与高校开展学科共建，形成基础学科、特色学科与工程应用相互支撑的格局。<\/p><p>    此外，甘肃电科院以平台化思维整合科研资源，打破部门壁垒，建立跨领域、多专业协同的科研共享机制。围绕数智化电网建设和国家电网有限公司相关规划，该院持续推进原创技术策源地建设，建立项目动态储备机制，在立项阶段同步明确技术成熟度与转化要求，实现项目攻关、平台验证、示范应用、产业转化贯通衔接。该院还通过成果跨省共享、转化激励和后评价等机制，促进成果孵化与推广应用。<\/p><p>    创新的根本在人才。甘肃电科院围绕“选得准、育得实、留得住”，建立以履职效能为核心、科研成果为支撑的人才选拔体系，将项目攻坚、技术创新和实际贡献作为重要评价依据；通过岗位履职培训、轮岗见习、项目实践等方式，推动青年骨干在重大任务中历练成长；对人才实行“一人一策”培养，组建“多对一”导师团队，建立以价值创新为导向的人才评价机制，对在重大科技任务中取得突破的团队和个人给予激励。<\/p><p>    近5年来，甘肃电科院支持国网甘肃省电力公司牵头承担2项、参与4项智能电网国家科技重大专项，获甘肃省科技进步奖一等奖5项，牵头编制国际标准1项、国家标准5项；建设包含工学、理学和交叉学科的学科体系，覆盖10个二级学科、18个三级学科；深入实施新型电力系统科技攻关登高行动计划，1项成果入选工业和信息化部《先进安全应急装备推广目录》，2项重点成果上架国家电网公司电子商务平台科创专区、销售额达2600万元；加速建设人才队伍，培养出一批甘肃省拔尖领军人才、甘肃省第一层次领军人才、陇原青年英才等。<\/p>","Transfer":"","coord":"0.410000,73.460000,62.550000,73.460000,62.550000,99.580000,0.410000,99.580000"}]},"page_7":{"board_id":147836,"board_num":"7","alias":"配电网","img_url":"c7daa4bc-5e9c-4d24-b3be-0063a8d6b467.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/497752a1-4e00-4944-b5ae-3a5f3a48269a.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774052,"yinti":"","title":"韧性配电网抵御灾害保障民生用电","subtitle":"","yinwen":"国网辽宁电力开展配电网防灾抗灾改造，差异化补强网架结构，以——","author":"张爱萍","content":"<p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p class=\"not-indent patt\" style=\"max-width:100%;text-align: center;\"><\/p><p>    今夏，经历多轮强降雨等极端天气冲击，辽宁配电网防灾抗灾能力建设成效得到充分检验。<\/p><p>    今年，国网辽宁省电力有限公司聚焦提升配电网韧性，差异化补强配电网网架结构，扎实落实各项应急防范措施，持续提升配电网抵御自然灾害能力，全力保障经济社会发展和民生用电需要。<\/p><p>    因地制宜实施差异化建设<\/p><p>    国网辽宁电力依据《配电网高质量发展行动实施方案（2024～2027年）》，逐一梳理近年辽宁地区配电线路沿线气象条件和受灾案例，深入分析灾害成因，编制《配电网防洪防雷差异化典型设计技术方案》，为全省配电网防灾工程提供规范统一、切实可行的建设指导。<\/p><p>    “我们因地制宜提升配电网抗灾等级，精准匹配灾害类型和地域特征，推动防灾模式从‘被动抢修’转为‘主动防御’，最大限度降低受灾损失，保障极端天气下可靠供电。”国网辽宁电力配网管理部运检处处长代子阔介绍，配电网差异化建设从源头上消除了安全隐患，实现沿海地区防风、山区防雷和低洼防涝，切实增强配电网韧性，提升本质安全水平。<\/p><p>    7月，丹东地区遭遇连续强降雨天气。洪峰过境期间，宽甸满族自治县沿江区域的10千伏鸭江线、振石线、振青线安然无恙。这得益于4月份竣工的配电网防汛抗灾应急大修工程，该工程也是国网辽宁电力山区配电网差异化防灾建设的典型实践。3条线路防汛抗灾等级显著提升，保障了沿线居民及边防等重要用电客户的稳定用电。<\/p><p>    丹东供电公司针对线路紧邻江边、汛期易受江水冲刷的实际，前期组织专班逐基摸排杆塔基础水毁风险，精准锁定8个易受强降雨冲刷的高风险点位。工程建设采取差异化加固方案，在临江陡坡段修筑混凝土护坡，在松软地质区夯实培土，提升杆塔抗冲击能力。该公司配网管理部副主任刘晗说：“我们结合现场地形条件，再次紧固拉线稳固杆塔，增强线路整体韧性，提升应对强降雨能力。”<\/p><p>    国网辽宁电力总结应对台风“巴威”引发暴雨灾害的经验，进一步提高防洪、防冰、防山火等的设计标准，系统梳理配电网薄弱环节，计划再建设一批配电网项目；针对积水倒灌的地下配电站房，统筹优化站房选址和线路路径，推动“下改上”或地下全封闭改造，切实增强电网的防灾抗灾能力。<\/p><p>    关口前移筑牢保供电防线<\/p><p>    配电网设备点多面广、部分设备处于低洼易涝地段、老旧设备抵御灾害能力较弱……多种因素叠加，给配电网安全稳定运行带来挑战。国网辽宁电力前移防汛关口，摸排设备运行情况，高效治理缺陷隐患，全面筑牢配电网汛期安全防线。<\/p><p>    汛期来临前，国网辽宁电力持续开展配电网防汛隐患再排查、再治理工作，落实责任到人，限期整改，将356处隐患全部清零。<\/p><p>    “我们针对地下配电站房采取了沙袋封堵、加高挡水门槛、封堵电缆沟孔洞等防倒灌措施，全面加固了低洼地段设备基础，加强设备防水防护，从源头降低风险。”国网辽宁电力配网管理部运检处专责赵传宗说。<\/p><p>    阜新供电公司员工在专项排查彰武县10千伏哈西线等7条重点线路时，发现地处低洼地带的哈西线机关山支线9号电杆基础存在雨水冲刷、水土流失的安全隐患，强降雨极易造成杆基倾斜。该公司迅速通过土方回填加固、修筑排水护坡的方式确保杆基稳固，线路经受住了7月份3轮强降雨天气的考验。<\/p><p>    在配电网安全隐患排查治理中，国网辽宁电力规模化应用搭载红外热成像仪的无人机，精细化巡检偏远区段、交叉跨越点位、临近河道线路，精准捕捉安全隐患，帮助运维人员快速发现电杆倾斜、基础破损、树线距离不足等问题。该公司还巡检了2053处“三跨”点位，织密线路安全隐患立体排查网络，推动运维工作由“被动响应”向“主动预警”转变。<\/p><p>    “我们提前集结应急力量，充分做好防汛抗灾准备，提升应急抢险保供能力。”赵传宗说，国网辽宁电力在不停电施工、抢修复电、应急抢险过程中全面投入中低压发电车、应急电源车、移动储能电源等应急装备；在移动电源车上安装车载智能终端，实时监测移动电源车定位和机组运行情况，辅助抢修人员精准高效地开展保供工作。<\/p><p>    快速响应增强抗灾实战能力<\/p><p>    台风“巴威”带来的强降雨造成沈阳、抚顺、铁岭等城市发生内涝、河道漫溢险情。沈阳低洼小区地下配电设施大面积进水受损，影响居民生活用电。<\/p><p>    国网辽宁电力快速响应、高效处置，应用配电网全景监测平台功能，实时监测小区地下配电设施运行状态，为统筹部署抢修工作提供信息依据；依托“配电网负荷转供智能生成”人工智能场景，打通配电自动化系统与调度操作流程，快速完成负荷转供；使用无人机、红外测温技术累计开展雨后特巡1042次，精准定位灾情隐患。<\/p><p>    在水淹小区现场，国网辽宁电力通过配电网数字化管控微应用群，快速厘清了小区设备台账、现场条件、防汛物资、抢修联络人等信息，严格执行“先复电、后抢修；先民生、后设备；先安全、后作业”原则，创新推行“一小区一方案、一作业队伍、一现场总指挥、专职安全监护”抢修模式。<\/p><p>    “我们针对现场实际情况因地制宜创新灾后复电技术，打破难点和堵点，高效推进抢修进程。”代子阔介绍。<\/p><p>    沈阳万科翡翠别墅小区部分地下供电设备被淹受损，应急发电车无法进场作业，但小区地面供电设备完好。抢修队伍就近找到一处正常运行的电源点，调整供电运行方式，架设临时供电线路直接为地面供电设施送电。<\/p><p>    沈阳供电公司针对金地峯范小区地下设备水浸、暂不具备修复条件的情况，搭建临时变压器台区，敷设临时集束导线，采取化整为零、分区分片方式，按台区有序恢复供电，持续缩小停电范围，逐步实现全域复电。<\/p><p>    “我们第一时间隔离受灾配电站房，让受灾区域可控、非受灾区域先复电，缩小停电范围，减少停电时长。”沈阳供电公司配网管理部副主任李袭说。<\/p><p>    为应对强降雨，国网辽宁电力还在沈阳、抚顺、铁岭等城市的地势较低的台区提前存放排水泵、装配式挡水板等成套装备，最大限度缩短转运时间，提供防灾减灾物资保障，进一步提升了应急响应速度。<\/p>","Transfer":"","coord":"0.410000,6.180000,66.070000,6.180000,66.070000,69.380000,0.410000,69.380000","imageinfo":[{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/6f70945c-8914-4c05-9111-4bb7343ed68c.jpg.1","text":"    6月11日，鞍山供电公司员工检查防汛物资储备情况。杨大川 摄"},{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/c3a090ad-9fe9-4acc-95dd-cf06ea8ab70f.jpg.1","text":"    7月15日，锦州供电公司在沈阳浑南区10千伏冷库甲线、冷库乙线开展变压器台区组立作业，紧急抢修恢复唯美品格小区供电。    陆宇石 摄"},{"path":"https://epaper.sgcctop.com/fz/pic/202608/10/b2da808c-0865-492e-9f80-d54391a44219.jpg.1","text":"    7月22日，抚顺供电公司员工实施10千伏大杨线改造。邱林 摄"}]},{"contentid":774053,"yinti":"","title":"“技术+管理”双管齐下治线损","subtitle":"","yinwen":"山东日照供电公司","author":"单晓禹 邢奥","content":"<p>    8月3日，山东日照供电公司开发区供电中心计量班班长陈常涛通过智能监测平台捕捉到数据异动后，第一时间联合用电稽查人员赶往沿海鱼塘片区。<\/p><p>    经现场排查，供电员工发现一户养殖户存在私拉裸线、绕越计量装置的窃电违规行为，并快速完成安全隐患处置。数字化监测体系落地前，沿海养殖线路用电点位分散、隐蔽窃电多发，传统线下人工摸排效率低，全线巡检往往需要两三天，隐性窃电、计量故障难以被及时发现。<\/p><p>    如今依托数字化监测体系，异常用电点位、计量故障等可远程精准定位，彻底告别以往“大海捞针”式治理。2025年，日照供电公司累计完成22条沿海顽固高损线路专项整治，线路损耗波动问题得到根本性改善。<\/p><p>    聚焦沿海养殖负荷集中、分布式电源大规模并网、每个县电网情况不同等实际，日照供电公司自主研发两套数字化系统，实现数据自动化处理、台区潮流智能调控，从技术端压降无效损耗。<\/p><p>    针对海量线损指标人工核算耗时费力问题，日照供电公司上线全流程自动化线损测算机器人，全市19项线损核心指标的数据导出、运算、汇总实现一键自动处理，每日监测发布工作用时由2小时压缩至10分钟，减轻一线人员工作压力。<\/p><p>    日照供电公司聚焦分布式光伏大规模并网、反向送电推高台区损耗难题，研发光储配置优化系统，实时跟踪台区分布式电源出力、电网潮流走向，自动调节储能设备投运规模，化解光伏反向送电带来的线损率升高问题。该系统在莒县等地的分布式光伏发电用户密集的台区投用后，高损台区实现动态清零，全市0.4千伏低压台区综合线损率下降了0.19个百分点。<\/p><p>    日照供电公司同步建立“顶层统筹、市县协同、基层攻坚”三级闭环管理机制，压实线损管控责任，补齐管理短板。该公司建立一把手负责制，先后组织9次专题推进会、6期实景实操培训，解决了图模不实等问题，理论线损合格率达97%。该公司采用“一县一策”方式，安排专业团队驻点帮扶落后县级供电公司，形成“帮扶—评估—优化”闭环管理机制。该公司还组建线损专家包保小组，会诊疑难问题，搭建现场实景课堂，实行技能过关考核，已累计帮助解决基层遇到的各类线损治理难题1064项。<\/p><p>    一系列科技、管理组合举措落地见效。2025年，日照供电公司综合线损率压降0.1个百分点，全年3次获评国家电网有限公司同期线损管理“十强市公司”；10千伏线路、配电台区经济运行水平分别提升6.5、4.7个百分点，105个存量高损台区全部清零，累计减少电量损失1616万千瓦时。通过专项帮扶，莒县供电公司综合线损率下降0.38个百分点；五莲县供电公司连续6个月入围国家电网公司同期线损管理“百强县公司”。<\/p>","Transfer":"","coord":"99.420000,13.760000,99.420000,10.810000,99.420000,8.290000,71.670000,8.290000,71.670000,10.810000,71.670000,13.760000,71.670000,46.910000,99.420000,46.910000"},{"contentid":774054,"yinti":"","title":"更好化解光伏台区电压扰动难题","subtitle":"","yinwen":"河南镇平县供电公司构建群调群控系统，远程调控分布式光伏发电客户较多台区运行参数，及时处置台区终端设备故障。","author":"裴晓阳","content":"<p>    “老庄镇江田村1号台区的光伏电站逆变器有功功率大，导致台区出现反向过载，造成台区单相供电电压达到240伏，高于正常值，群调群控系统已开始对该台区的供电电压实时远程调控。”8月5日8时10分，河南镇平县供电公司运检部配电台区供电电压群调群控系统运维专责冯戈在工作日志上记录下当日该系统的运行情况。<\/p><p>    此后数秒，群调群控系统下达调控指令，台区多设备协同联动，优化调整了台区光伏电站逆变器有功功率、无功功率、公用配电变压器低压侧出口电压、台区无功补偿容量、客户用电负荷等运行参数，台区无功功率实现就地平衡，老庄镇江田村1号台区电压恢复到合格范围内。<\/p><p>    分布式光伏电站并网点分散，发电有功功率等参数波动大，加上台区用电负荷增长、设施老化等因素影响，容易引发配电变压器反向过载、台区供电电压波动、台区三相负荷不平衡等问题，造成台区供电不稳，台区供电电压需要实时精准调控。<\/p><p>    以往，台区供电电压向上或向下越限时，配电运维人员须逐一排查设备运行状态、调控运行参数，调控效率低、工作量大且存在滞后性，难以应对分布式光伏并网发电等因素带来的参数快速波动、电压起伏等问题。<\/p><p>    为了及时高效调控台区供电电压，3月，镇平县供电公司组织员工为光伏并网发电用户较多的台区加装智能融合终端，指导客户为逆变器安装遥调设备，使分布式光伏电站可观、可测、可调、可控。<\/p><p>    在此基础上，镇平县供电公司构建“配电自动化系统主站（调度主站）－台区智能融合终端－终端设备”的群调群控系统，实现台区运行数据互联互通、设备协同联动。该系统依托通信网络实时监测台区运行数据，主站自动研判异常参数，生成并下达调控指令，各终端设备收到主站下达的调控指令后，在线调节台区光伏并网发电出力、光伏发电并网点电压等参数，使台区的异常参数恢复至正常范围内，解决配电变压器重过载、台区供电电压越限等问题，稳定台区受电端电压，提升台区供电质量。<\/p><p>    依托群调群控系统，镇平县供电公司运维人员能够清晰掌握台区内每台设备的运行状态、调控过程中各参数变化情况和最终的调控结果，同时对台区供电电压调控成效开展分析评估，及时查找台区内影响电压调控质量的因素，有针对性地采取改造线路、优化台区布点、增容配电变压器等措施，调控台区供电电压。<\/p><p>    与此同时，镇平县供电公司还根据群调群控系统调控台区供电电压的需要，在台区低压侧加装智能换相开关、智能电压传感器等设备，在光伏发电用户侧安装光伏并网发电开关、储能设备，提升该系统对台区运行参数变化的快速感知和精准调控能力。<\/p><p>    镇平县供电公司还在各乡镇中心供电所组建了群调群控系统台区终端设备运维专班，定期排查终端设备，现场测试数据采集模块、通信线路和设备运行状态，就地核对群调群控系统监测的数据上传、下达的调控指令接收和执行情况，及时处置台区终端设备运行异常、通信信号中断等故障。<\/p><p>    截至目前，镇平县供电公司已通过群调群控系统对28个台区的配电变压器异常运行参数进行远程调控。调控后的台区供电电压均恢复到合格范围内，惠及用户1.3万户。1～7月，该公司台区电压合格率达到99.6%，同比提升了4.35个百分点。<\/p>","Transfer":"","coord":"71.670000,51.970000,99.420000,51.970000,99.420000,99.580000,71.670000,99.580000"},{"contentid":774055,"yinti":"","title":"科技助力实战，故障研判准抢修快","subtitle":"","yinwen":"国网重庆电力依托配电数字化管控平台开发“七个自动”功能，在配电网数字化管控微应用平台上线“三主动”功能，引进带电作业机器人，实现——","author":"游绍斌","content":"<p>    8月2日12时6分，重庆10千伏三响线开关保护动作跳闸。大足供电公司调控中心值班调度员雷铠源运用配电数字化管控平台故障研判模块，快速锁定故障区段为10千伏三响线响联支线2号杆后段。随后，他通过配电网自动化系统远程遥控隔离故障，恢复了三响线响联支线2号杆前段线路供电。该公司运维人员随后快速开展三响线响联支线2号杆后段故障排查抢修。14时30分，抢修工作完成。<\/p><p>    “依托配电数字化管控平台故障研判功能，可快速定位故障杆段，大幅减少故障排查时间，提高抢修效率。”大足供电公司调控班班长肖瑾说。<\/p><p>    针对配电网点多面广、供电可靠性需求持续提升的实际，国网重庆市电力公司依托配电数字化管控平台开发停电范围自动扫描，故障精准自动研判，停电信息自动推送，供电可靠性、电压合格率、线损自动统计和网络拓扑自动校核“七个自动”功能，实现故障研判从“人工经验判断”向“数据驱动决策”转变，显著缩短故障处置时间，提升供电可靠性。同时，该公司依托新一代设备资产精益管理系统、“电网一张图”、实时量测中心等平台，通过数据链路监测等方式不断提高源端数据接入时效性、完整性和准确性。目前，该公司配电网故障研判准确率提升至97.6%以上，故障抢修时间进一步缩短。<\/p><p>    在开发“七个自动”功能提升故障研判准确性的同时，6月初，国网重庆电力在配电网数字化管控微应用平台上线了主动运维、主动检修、主动抢修的“三主动”功能，推动电网设备运维、检修、抢修工作数字化转型，推进电网检修模式从传统“经验驱动”向精准“数据驱动”迭代升级。<\/p><p>    7月27日8时3分，黔江供电公司石会供电所副所长姜伟的手机弹出一条信息：10千伏石沙线沙坝乡脉东村加油站旁居民点公用变压器过载，导致单相接地故障。他立即登录配电网数字化管控微应用平台，点击“主动抢修”功能模块下发抢修单。8时5分，技术员刘伟国接单，随后和同事迅速赶到现场处置故障。9时9分，供电员工顺利完成抢修工单任务。<\/p><p>    主动运维功能运用线上定时监测、无人机巡检等数字化手段生成周期性巡检工单。主动检修功能依托主动检修管控工具精准研判缺陷治理需求，将工单发送至基层班组移动工作台。主动抢修功能依托配电网数字化管控微应用平台异常预警模块，全天候动态监测线路、台区运行状态，提前识别设备异常、预判故障隐患点，主动发起抢修处置工单，实现故障隐患早发现、早处置。<\/p><p>    “三主动”功能上线两个月来，配电网数字化管控微应用平台累计生成主动运维工单2805张，登记缺陷隐患工单806张，下达主动检修工单411张，发起主动抢修工单5.36万张，配电网故障平均处置时长缩短至35分钟。<\/p><p>    除研发数字化平台、推进配电网运维数字化转型外，国网重庆电力还引进带电作业机器人，提升带电作业效率。<\/p><p>    7月14日，在沙坪坝区中梁镇10千伏中永线48号杆下，市区供电公司输电运检中心带电作业班员工设置好安全围栏后，启动带电作业车的斗臂，将一台双臂带电作业机器人送至十余米高空。地面上，一名操作人员通过平板电脑下达操作指令，机器人依托高清视觉识别、激光雷达感知系统精准定位，依次完成导线剥线、接地环抓取、对位、安装等操作。23分钟后，三相导线的接地环安装完成。<\/p><p>    “传统人工带电安装三相接地环需要一两个小时，应用双臂带电作业机器人安装接地环用时平均缩短50分钟。带电作业从‘高空人工操作’向‘地面智能操控’转型。”市区供电公司输电运检中心员工朱强介绍。<\/p><p>    国网重庆电力于2019年开展单臂机器人试点应用。2025年，该公司增加10台双臂带电作业机器人开展现场深化应用。目前，带电作业机器人可实施带电断接引流线、安装接地环、安装故障指示器等6类作业。年初至今，该公司应用带电作业机器人累计开展配电网检修作业320余次。<\/p>","Transfer":"","coord":"0.410000,71.910000,66.070000,71.910000,66.070000,99.580000,0.410000,99.580000"}]},"page_8":{"board_id":147837,"board_num":"8","alias":"亮文化","img_url":"2d89762b-b04c-4fe1-9193-2df175109fca.jpg","pdf_url":"https://epaper.sgcctop.com/fz/att/202608/10/4ea73f28-e7cf-41ce-9ba7-eceb3875046d.pdf","board_width":1620,"board_height":2389,"data":[{"contentid":774056,"yinti":"","title":"家书中的长征往事","subtitle":"","yinwen":"开栏的话 伟大长征精神，是党和人民付出巨大代价、进行伟大斗争获得的宝贵精神财富。本报今起开设“长征精神·纪念中国工农红军长征胜利90周年”栏目，让我们一同回望这段伟大的征途，铭记革命历史，从革命文化中赓续红色血脉、汲取奋进力量。","author":"","content":"<p>    <\/p><p>    “长征是宣言书，长征是宣传队，长征是播种机。”90年来，长征精神激励中国人民战胜各种艰难险阻，不断取得胜利。今年是红军长征胜利90周年，盘点与长征有关的家书，重温革命先辈坚如磐石的理想信念、英勇无畏的牺牲精神、百折不挠的坚强意志、思亲念家的人伦亲情，一次次令人动容。一行行滚烫的文字背后，是一段段值得永远铭记的历史。<\/p><p>    革命不成功，我不回家<\/p><p>    在江西省于都县中央红军长征出发纪念馆，陈列着多封红军发自战地的家书，其中一封的作者是李骏。李骏是于都县罗坳镇塘头村人，1926年入党，参加过北伐战争和南昌起义，之后回乡组织农民武装，参加了赣西南苏区的创建和中央苏区历次反“围剿”斗争。<\/p><p>    1934年10月，李骏随部队到达于都河畔集结，他在离家不远的石尾渡口指挥部队过江。因为离家近，师长主动批准他回去与家人告别。然而为了大局，李骏婉言谢绝，一直坚守岗位。当全师指战员渡江之后，李骏又随部进军到于都县牛岭。在全师做突破敌人第一道封锁线准备的空隙，他提笔给时任于都罗坳区委妇女部部长的妻子钟华英写了一封短信，委托一位地方干部代交。后来，这封信辗转送到了钟华英手中。<\/p><p>    妻：华英<\/p><p>    我已远征而去。何日返乡，无可料之。望妻上尊高堂，下抚孩儿，替我尽孝尽责。我已立志革命，而现革命尚未成功，我必将继续为之。革命不成功，我不回家，成功之日见。<\/p><p>    李骏书  <\/p><p>    1934年10月<\/p><p>    寥寥数语，饱含柔情与壮志，尽显热血与担当。这封不足百字的短笺，既是夫妻间的离别信，更是一份赤诚的革命宣言。随后，李骏随部队踏上了凶险的长征路。1935年1月28日，在贵州遵义青杠坡战斗中，时任红3军团第6师代理参谋长的李骏率领突击营杀向敌阵，不幸中弹牺牲。<\/p><p>    万里长征，在所不辞<\/p><p>    高捷成，福建漳州人，在省立二师学习期间，深受民主爱国进步思想影响，积极参加反帝爱国活动。他早年参加国民革命军和北伐，后离开国民党军队，考入厦门大学经济学系学习，后到上海中南银行工作。<\/p><p>    1930年春，高捷成回到家乡漳州，在其宗叔高开国的百川银庄里当出纳。此时，闽南游击队蓬勃发展，但枪弹武器、经费严重缺乏，他先后从其宗叔银庄悄悄拿出2万多块银圆，支援红军闽南游击队活动。1932年，高捷成到江西瑞金，参加苏维埃国家银行工作，创立红军会计制度，并加入中国共产党。高捷成参加了第四、第五次反“围剿”，1934年10月随中央军委第二野战纵队第15大队转移，参加长征，1935年10月到达陕北，1936年12月毕业于抗日红军大学第一期。1937年4月10日，他在延安给宗叔高开国写了一封信，陈述了自己离家六年的心路历程：“在这六年中东西奔波，南北追逐，历尽一切千辛万苦，雪山草地，万里长征，在所不辞！无非为的是挽救国家的危亡！志向所趋，海浪风波在所难阻！”参加革命后，高捷成南征北战，却时刻惦记着所欠叔父银庄的那笔款项。在信中，他告诉宗叔，“我所欠挂百川银庄二万多元的债，时刻记念在心，本利至今当在三万余。国家得救，民族得存，清债还利当不短欠分文”。这充分显示了他对革命必胜的坚定信念。他将个人信义与民族大义融为一体，体现了革命者的责任与担当。<\/p><p>    高捷成后来随八路军129师赴华北，1938年6月任129师新385旅组织科长，9月任冀南区税务总局局长，为根据地财经工作奠基；1939年10月，任冀南银行总行行长，发行冀南钞，打响抗日金融战。1943年5月14日，高捷成检查部署反“扫荡”与货币斗争工作，行至河北内丘县白鹿角村遭日军包围，壮烈殉国，年仅34岁。<\/p><p>    老红军重走长征路<\/p><p>    在人民大学家书博物馆中陈列着老红军李真的一封家书，是1986年1月25日写给弟弟李振岐的，洋洋洒洒5页。他在信中首先告诉弟弟自己从总后副政委的领导岗位上退了下来，而且非常高兴地接受了这次变动。接着，他用一大段文字，介绍了自己重走长征路的感悟。信中说：<\/p><p>    “去年十月经上级批准，我到过去红军长征的路上，走了一段。还到我二、六军团渡金沙江的石鼓渡口看了看。我们过的第一座大雪山——玉龙雪山也在眼前，不过这一次没有去爬了！根据年龄和身体条件，恐怕也不能再爬了。但见景生情，在我二、六军团爬的几个大雪山，就牺牲了一千多位革命志士，我是幸存者，今天能来到四十八年前战友们因缺氧和饥寒交迫的情况下，而悻悻离开人世的地方。哪有不动情呢？这些同志死得过早，什么也没有得到，什么家庭、妻子、儿女，那时恐怕连想都没有想过。他们的意志、勇敢、才华都很好，可惜过于年轻，就失去了一切。”<\/p><p>    李真是江西永新人，1918年生，少年辍学，成了放牛娃。12岁参加儿童团，1932年不满14岁就参加了红军。因年龄小，开始被分配在红军医院当卫生兵，不久调入师部卫生科当救护员，多次参加战斗，抢救受伤战士，1933年1月入党。1934年8月，李真随红六军团离开湘赣苏区长征。1935年4月任红六军团卫生部医务科政治指导员。红二、六军团改称中国工农红军第二方面军后，调至红十八师特务连任政治指导员。红六军团作为中央红军长征的先遣队，转战数千里，突破敌人的多道封锁线，在黔西的乌蒙大山中回旋，强渡乌江天险和金沙江，翻越玉龙大雪山，通过阿坝草地，经过艰苦的战斗和行军，于1936年10月22日在甘肃会宁东北的将台堡与红一方面军会师。<\/p><p>    习近平总书记指出，“一代人有一代人的长征，一代人有一代人的担当。建成社会主义现代化强国，实现中华民族伟大复兴，是一场接力跑”。新时代我们需要讲好长征故事，铭记革命历史，传承先烈精神，汲取奋进力量。<\/p><p>    （原载《学习时报》8月5日第5版）<\/p>","Transfer":"","coord":"0.830000,6.180000,58.820000,6.180000,58.820000,50.420000,0.830000,50.420000"},{"contentid":774057,"yinti":"","title":"好心“卡友”千里护送货车归乡","subtitle":"","yinwen":"","author":"","content":"<p>    “刘兄弟，到家了！”一声悠长鸣笛划破长空，一辆贴着“回家”二字的大货车缓缓驶入江苏徐州。近日，江苏货车司机刘先生在陕西咸阳不幸离世，亲属无力将他赖以谋生的货车开回老家，四位素不相识的“卡友”（货车司机互称彼此为“卡友”）挺身而出，克服多重困难，护送车辆回家。<\/p><p>    34岁的货车司机刘先生是家中顶梁柱。7月22日，他在陕西咸阳一处服务区休息时突发疾病离世。三天后，遗体被家属接回，但那辆维系全家生计的重型卡车，却成了横亘在眼前的最大难题——家属无力驾驶，多方求助无果，即便愿出钱雇人，也无人接这桩棘手差事。<\/p><p>    万般无奈之际，经热心人辗转牵线，7月25日晚，山东冠县“卡友”靖得月获知了家属求助信息。靖得月在短视频平台开设了账号，常年记录货运生活，传递行业正能量。他和来自河南许昌、河南开封、安徽亳州的三位“卡友”经常一起帮助遇到困难的同行。得知刘某家庭的困境，四人未有一丝迟疑，连夜整装出发。靖得月表示：“对于货车司机来说，一辆车就是一辈子的家业。老人当时反复说，没能力把车开回来，这是孩子留给家里唯一的念想和生计。我们听完，心里很不是滋味。”<\/p><p>    抵达陕西咸阳事发服务区时，眼前的景象让四人心情沉重。<\/p><p>    时值盛夏，密闭的车厢内气味刺鼻。家属此前因悲痛慌乱、求助心切，未详细告知现场情况。即便突发意外状况，四位“卡友”也没有一句怨言，始终全心全力想要帮这个苦难家庭圆梦。<\/p><p>    为做好安全防护、洁净车辆环境，四人自掏腰包花费一千余元，采购酒精、消毒液、防护服、医用手套、空气清新剂等全套物资，对照专业消杀标准，对货车车厢、车身、内饰进行全方位细致消杀，从白天忙碌至深夜。<\/p><p>    一切就绪，他们在车头郑重贴上“回家”二字。这一贴，是对逝者的告别，更是对生者的承诺。<\/p><p>    为了通风散味，四人全程敞开车窗，反复喷洒空气清新剂，即便穿戴着全套防护装备，依旧难以抵挡刺鼻异味的侵扰，身心承受着巨大压力。他们采取“两班倒”模式：两人驾驶货车，另两人驾乘私家车随行保障。车轮滚滚，昼夜兼程，他们用坚韧的意志，一路护送车辆平安返回徐州。<\/p><p>    7月28日早上，一辆车头贴着“回家”两个字的大货车驶入江苏徐州，历经一天一夜的千里奔波，四位热心“卡友”终于将车辆交到离世司机刘先生的父亲和女儿手中。<\/p><p>    “刘兄弟，到家了”一句轻声呼唤，道尽了四位“卡友”的赤诚与温柔。见到逝者年迈的父亲和年幼的女儿，几位铁骨铮铮的汉子红了眼眶。他们不仅分文未取，还悄悄凑了2000元钱塞到家属手中。<\/p><p>    这场跨越千余公里的奔赴承载着他们对逝者最深沉的敬意，也寄托着对一个家庭最温柔的守护。向四名货车司机致敬！<\/p><p>    （来源：央视新闻微信公众号，原题为《“刘兄弟，到家了！”》）<\/p>","Transfer":"","coord":"63.790000,6.180000,99.420000,6.180000,99.420000,36.380000,63.790000,36.380000"},{"contentid":774058,"yinti":"","title":"字母词涌入中文，是否影响汉语美感","subtitle":"","yinwen":"","author":"","content":"<p>    “去K歌”“站C位”“P照片”“见CEO”“做PPT”“照CT”“做B超”“进ICU”……这些字母词大量涌入，充斥我们生活的点点滴滴。由此也有人提出，这些字母词，是否会影响中文的美感呢？<\/p><p>    客观来看，语言的交流是很常见的。这些英文词会进入中文，那么反过来，中文也会进入其他的语言。此前就有媒体报道，像add oil（加油）、long time no see（好久不见）、“jiaozi”（饺子）、“hongbao”（红包）等等也都进入英文词典。语言从来不是封闭的系统，而是在交流碰撞中不断丰富的活水。<\/p><p>    而这会影响语言的美感吗？倒也未必。仔细想想，这些字母词不仅是进入了中文，其实也是被中文改造了。比如“去K歌”“站C位”“P照片”等等，字母早已不是原来的英文单词，而是被赋予了汉语的语法和语感，“K”成了动词性的语素，“P”可以带宾语、加时态色彩，“C位”更是英文里根本不存在的词。<\/p><p>    换句话说，字母词进入中文的过程，与其说是字母的“涌入”，不如说是汉语的“收编”：汉语按照自己的表达习惯，把这些字母拆解、重组、赋义，造出了一批英语母语者看不懂、只有中文使用者才心领神会的新词。<\/p><p>    中文不仅在借鉴、音译，而且创造新的语境。就像“拿铁”，看似音译，早已成了中文语境的亚文化，一个“铁”字，让轻柔的咖啡似乎透出一股力量感，还创造出了“如果生活不能拿捏，那就拿铁”之类的网络梗。<\/p><p>    中文，就是这样一门语言：借鉴的，也能玩出新花样，变成自己的。几千年来，从“葡萄”“琵琶”到“沙发”“咖啡”，它一路吞吐吸纳，却从未失去自己的底色。<\/p><p>    这恰恰说明，汉语的美感并不脆弱，它不仅没有被字母词冲淡，反而在改造外语的过程中，展现出灵活而旺盛的创造力。<\/p><p>    当然，今天中文可能也需要一些有意识的美感提炼。比如前段时间，“Token”就被正式翻译成了“词元”。这个翻译颇见功力：“词”点明它与语言的关联，“元”表明它是最小的处理单元，两个字既准确又雅驯，比生硬的音译“托肯”之类高明不少。<\/p><p>    这样的成功先例其实不少：“laser”译作“激光”，“gene”译作“基因”，“humor”译作“幽默”，音、义、美三者兼得，早已成为汉语的经典之笔。<\/p><p>    可见，语言的自然筛选和有意识的提炼并不矛盾：前者让好用的词留下来，后者则为新事物及时提供优雅的中文名字。人们不必追求一种绝对的一致，字母词还是中文音译，都可以并行不悖，关键是好用、好懂、好听。字母词的涌入，考验的与其说是纯洁性，倒不如说是消化力，这恰恰是汉语几千年来最不缺的东西。<\/p><p>    （来源：光明日报微信公众号，有删节）<\/p>","Transfer":"","coord":"63.790000,39.890000,99.420000,39.890000,99.420000,66.290000,63.790000,66.290000"},{"contentid":774059,"yinti":"","title":"火热暑期档，“电影+”活力涌动","subtitle":"","yinwen":"","author":"","content":"<p>    2026年暑期，国内院线市场热度持续攀升，各类优质影片陆续上线，实现口碑与票房双丰收。“电影+”模式串联起文旅出游、商圈消费、文创体验等多元消费场景，成功将“人气流量”转化为实打实的市场“消费增量”。<\/p><p>    多元供给，暑期档热度持续攀升<\/p><p>    进入8月，国内暑期档电影市场热度持续走高，大众观影消费需求集中释放。据猫眼专业版实时统计数据，截至8月7日，2026年中国电影暑期档（6月1日至8月31日）总票房突破80亿元，市场表现大幅超越去年同期；2026年度全国电影总票房（含预售）已突破237亿元，暑期档成为拉动年度票房增长的重要引擎。<\/p><p>    今年暑期档共有超100部中外影片陆续登陆全国院线，题材覆盖历史、喜剧、动作、动画、科幻等多种类型，充分满足不同年龄段观众的观影需求，市场供给丰富多元。其中，以红军长征中四渡赤水战役为背景的重大革命历史题材影片《四渡》自6月26日上映，多日蝉联单日票房冠军。该片兼顾宏大叙事与微观人物，既展现领袖战略智慧，也刻画普通红军战士浴血奋战的场景，形象地说明了四渡赤水的胜利是革命信念、精神意志、战略战术、人民支持合力铸就的人间奇迹。<\/p><p>    “头部强、口碑稳、类型多”是今年暑期档的特征。截至8月5日，周星驰执导的现实励志题材影片《功夫女足》累计票房突破22亿元，领跑2026年暑期档票房榜单。该片讲述草根女足“娥眉队”征战“至尊无敌杯”逆袭夺冠的热血故事。影片融合趣味叙事与热血竞技内核，唤醒观众对于经典喜剧的记忆。国风动画《八仙！》作为暑期档“黑马”，上演口碑驱动票房逆袭的经典范例。影片以传统八仙神话为蓝本，运用青绿山水美学构建蓬莱仙境视觉体系，将八位普通人的冒险奇遇作为叙事主线，深度诠释守望相助、携手共进的精神内核，上映10天票房就突破8亿元。近日，片方正式宣布海外上映计划，8月中旬登陆大洋洲、北美、英国、荷兰等多地院线，9月覆盖比利时、卢森堡等欧洲地区，让中国传统神话故事跨越山海走向世界。此外，《奥德赛》《密档》等中外新片还将陆续上映，不断升温暑期档热度。<\/p><p>    深耕内容，国产电影口碑票房双丰收<\/p><p>    这个暑期档，国产影片实现全方位领跑，创作体系持续完善，类型全面拓宽，传统文化创新转化，口碑票房双丰收，真正实现“以好内容留住观众、以精品力作激活市场”。<\/p><p>    都市情感片《想你了》将目光投向普通人的思念与离别，用细腻生活化的镜头描摹当代人的情感困境与内心和解；现实题材影片《特立独行》聚焦青年群体的自我突围，讲述年轻人坚持本心追寻理想的成长故事；谍战题材《抓特务》立足特定历史年代，以紧张跌宕的叙事刻画隐蔽战线上无名英雄的忠诚与牺牲。暑期档国产影片在内容生产层面立足本土现实与优秀传统文化资源，摆脱同质化创作窠臼，兼顾主流价值表达与大众审美趣味，实现题材挖掘、人物塑造、艺术表达的同步进阶。<\/p><p>    今年的暑期档国产影片塑造了鲜活立体的人物形象，给观众留下了很深的印象。《四渡》中坚守信仰、浴血奋战的红军战士，《功夫女足》里用汗水和倔强书写拼搏故事的普通女性，《特立独行》中怀揣理想、在现实磨砺中守住本心的青年……这些国产影片中，不同时代、不同境遇下的人，既闪耀理想光芒，也展露真实人性弱点，引发广泛情感共鸣。<\/p><p>    “电影+”赋能，流量转化消费增量<\/p><p>    今年以来，在国家电影局联合相关部门发起的“2026电影经济促进年”政策加持下，电影产业持续突破单一观影场景限制，实现线上线下流量向实体消费增量的转化。“跟着电影游中国”“跟着电影去旅游、品美食、赏非遗”等活动在这个暑期持续火热，一张电影票串联起观影、出游、实景体验、线下消费的完整产业链，有效激活夏日消费市场，进一步放大电影经济的外溢效应。<\/p><p>    “跟着电影去旅游”成为今夏文旅消费新风尚，热门影片取景地迎来客流大幅增长。《四渡》在大银幕上重现了那段波澜壮阔的历史，也将热度延伸到了现实之中。遵义、娄山关、土城古镇、赤水河畔、苟坝村、茅台镇……这些红军曾经走过和浴血奋战过的地方成为全国各地游客争相打卡的红色地标。《八仙！》上映后，山东烟台的蓬莱阁、八仙过海等景区的游客接待量明显上涨。在“八仙”主题市集，游客们看表演、品美食、做游戏，尽享夏夜清凉。影片中多次出现的永乐宫，原型在山西芮城永乐镇，据传也是吕洞宾的家乡。很多游客来到这里对照电影镜头寻找画面原型，在游览中感受中国古代壁画艺术的魅力。<\/p><p>    光影燃盛夏。2026年暑期档的火热，不只是一组亮眼的票房数据，更是中国电影产业转型升级的生动缩影。当下，我国电影产业既深耕内容创作，打磨更多兼具口碑与市场的优质作品、讲好中国故事，又持续拓宽产业边界、放大产业外溢效应，以光影之力赋能文化传播，激活广阔消费市场，丰富了大众精神文化生活。<\/p><p>    （综合《人民日报》、《北京日报》、《中国电影报》、央视新闻等报道，图片为资料图）<\/p>","Transfer":"","coord":"0.830000,64.610000,60.480000,64.610000,60.480000,97.470000,0.830000,97.470000"},{"contentid":774060,"yinti":"","title":"“一锤子买卖”要不得，文旅提质不分“淡旺季”","subtitle":"","yinwen":"","author":"","content":"<p>    暑期旅游旺季，一些景区的问题被曝光。有的网红漂流项目河道未经修整、暗礁密布，游客翻船受伤时有发生；有的景区出现打“擦边球”的低俗营销，相关企业被责令停业整顿；还有一批景区因达不到标准被取消3A等级……<\/p><p>    这些现象说明，优化旅游环境、补齐景区管理短板，依然任重道远。<\/p><p>    前不久印发的《旅游强国建设“十五五”规划》提出，到2030年，旅游业高质量发展取得明显成效，人民群众旅游满意度持续提升。实现这样的目标，仰赖每一个景区在硬件品质、游玩体验、安全管理等方面下真功夫。<\/p><p>    游客满意度，往往取决于景区经营者、管理者有没有换位思考。<\/p><p>    比如，黄鹤楼公园、青城山—都江堰景区等取消预约要求，在游客量不超过最大承载量的情况下，个人刷身份证即可现场购票入园。一个“做减法”的小举措，避免的是提前抢票的焦虑、到场扑空的烦恼，节省了游客时间成本。<\/p><p>    近年来，不少城市因美食、冰雪或赛事“出圈”，之所以能留下好口碑，就在于真诚对待每一位来客。游客要的是安心、舒心、称心的体验，谁能把这份朴素的期待接住，谁就能变流量为“留量”，激活文旅市场。<\/p><p>    客流涌来，是趁机降标准挣快钱，还是守住品质留长远口碑？这考验的是旅游经营者的定力与眼光。<\/p><p>    张家界今年暑期继续对核心景区严格分时段限流，把日接待量控制在承载上限以下；10余个省份的景区面向中高考毕业生推出门票减免等优惠举措，以“门票减法”换全域“消费加法”。限流是“少赚了”，免票更是“不赚了”，但恰恰因为算的不是眼前账，而是长远的品牌账、口碑账，才赢得了游客发自内心的认可。<\/p><p>    一个景区的声誉是日积月累攒出来的，毁掉它可能只需要一个旺季。把每个旺季都当成品质大考而非变现窗口，以长期主义的定力抵御短期逐利的冲动，日拱一卒、久久为功，才能让“头回客”变成“回头客”，让一时的网红景点成长为经久不衰的旅游品牌。<\/p><p>    旅游安全是底线，功夫须下在平时。<\/p><p>    近日，多地开展旅游市场专项治理，紧盯景区安全生产，完善应急处置预案，对违规案例持续公开曝光。这提醒我们，旅游市场链条长、环节多，从设施维护到人员培训，从客流预警到应急预案，任何一个环节松懈都可能酿成事故。<\/p><p>    暑期叠加汛期、极端天气多发，越是在这个时候，越要树立底线思维。把情况往最不利处推演、风险往最大处设想，将制度融入日常、规则变成习惯，才能有效防范化解风险，把隐患消灭在萌芽状态。<\/p><p>    优化旅游环境没有“淡旺季”之分，在提升体验、改善品质、保障安全上常抓不懈、精益求精，才能让每一位游客乘兴而来、满意而归。<\/p><p>    （来源：人民锐评微信公众号）<\/p>","Transfer":"","coord":"63.790000,68.820000,99.420000,68.820000,99.420000,97.470000,63.790000,97.470000"}]}};

             }
         };
		wx.onMenuShareTimeline(shareData);
        wx.onMenuShareAppMessage(shareData);
        wx.onMenuShareQQ(shareData);
        wx.onMenuShareQZone(shareData);
	}
	function resetWxShare(shareTitle,shareDesc,wxShareUrlOrig,wxShareImg){

             title: shareTitle,
             desc: shareDesc,
             link: wxShareUrlOrig,
             imgUrl: wxShareImg,
             success:shareSuccess
         };

        wx.onMenuShareAppMessage(shareData);
        wx.onMenuShareQQ(shareData);
        wx.onMenuShareQZone(shareData);

	function closeIFrame(){
